function InventoryModal(props){
  var editing = props.editing;
  var onClose = props.onClose;
  var onSave = props.onSave;

  var blank = { id:null, name:"", unit:"kg", stock:0, minStock:0 };
  var initial = editing ? Object.assign({}, editing) : blank;
  var [form, setForm] = useState(initial);

  function updateField(key, value){
    var next = Object.assign({}, form);
    next[key] = value;
    setForm(next);
  }

  function handleSubmit(){
    if (!form.name.trim()) return;
    var stockNum = Number(form.stock);
    var minNum = Number(form.minStock);
    if (isNaN(stockNum) || stockNum < 0) return;
    if (isNaN(minNum) || minNum < 0) return;
    onSave(Object.assign({}, form, {
      id: form.id || uid(),
      name: form.name.trim(),
      stock: stockNum,
      minStock: minNum
    }));
  }

  return (
    <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <h3>{editing ? "Editar insumo" : "Nuevo insumo"}</h3>

        <div className="field">
          <label>Nombre</label>
          <input type="text" value={form.name} placeholder="p. ej. Salmón" onChange={function(e){ updateField("name", e.target.value); }} />
        </div>

        <div className="field-row">
          <div className="field">
            <label>Unidad</label>
            <select value={form.unit} onChange={function(e){ updateField("unit", e.target.value); }}>
              {INVENTORY_UNITS.map(function(u){ return <option key={u} value={u}>{u}</option>; })}
            </select>
          </div>
          <div className="field">
            <label>Stock actual</label>
            <input type="number" min="0" step="0.01" value={form.stock} onChange={function(e){ updateField("stock", e.target.value); }} />
          </div>
        </div>

        <div className="field">
          <label>Stock mínimo (alerta)</label>
          <input type="number" min="0" step="0.01" value={form.minStock} onChange={function(e){ updateField("minStock", e.target.value); }} />
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSubmit}>Guardar insumo</button>
        </div>
      </div>
    </div>
  );
}

function InventoryCard(props){
  var item = props.item;
  var onAdjust = props.onAdjust;
  var onEdit = props.onEdit;
  var onDelete = props.onDelete;
  var [amount, setAmount] = useState("");

  var status = item.stock <= item.minStock ? "critico" : (item.stock <= item.minStock * 1.5 ? "bajo" : "ok");
  var statusLabel = status === "critico" ? "Crítico" : (status === "bajo" ? "Bajo" : "OK");

  function apply(sign){
    var n = Number(amount);
    if (!n || n <= 0) return;
    onAdjust(item.id, sign * n);
    setAmount("");
  }

  return (
    <div className={"inv-card " + status}>
      <div className="inv-top">
        <div className="inv-name">{item.name}</div>
        <span className={"inv-status-badge " + status}>{statusLabel}</span>
      </div>
      <div className="inv-stock">{item.stock} <span className="inv-unit">{item.unit}</span></div>
      <div className="inv-min">Mínimo: {item.minStock} {item.unit}</div>

      <div className="inv-adjust-row">
        <input type="number" min="0" step="0.01" value={amount} placeholder="Cantidad" onChange={function(e){ setAmount(e.target.value); }} />
        <button className="btn btn-ghost" onClick={function(){ apply(1); }}>+ Entrada</button>
        <button className="btn btn-ghost" onClick={function(){ apply(-1); }}>− Salida</button>
      </div>

      <div className="dish-actions">
        <button className="icon-btn" onClick={function(){ onEdit(item); }}>Editar</button>
        <button className="icon-btn" style={{color:"#C1443A"}} onClick={function(){ onDelete(item.id); }}>Eliminar</button>
      </div>
    </div>
  );
}

function InventarioModule(props){
  var inventory = props.inventory;
  var setInventory = props.setInventory;

  var [search, setSearch] = useState("");
  var [modalOpen, setModalOpen] = useState(false);
  var [editingItem, setEditingItem] = useState(null);

  var filtered = inventory.filter(function(it){ return it.name.toLowerCase().indexOf(search.toLowerCase()) !== -1; });
  var criticalCount = inventory.filter(function(it){ return it.stock <= it.minStock; }).length;

  function openNew(){ setEditingItem(null); setModalOpen(true); }
  function openEdit(item){ setEditingItem(item); setModalOpen(true); }

  function handleSave(item){
    var exists = inventory.some(function(i){ return i.id === item.id; });
    var next = exists
      ? inventory.map(function(i){ return i.id === item.id ? item : i; })
      : inventory.concat([item]);
    setInventory(next);
    setModalOpen(false);
  }

  async function handleDelete(id){
    if (!(await appConfirm("¿Eliminar este insumo del inventario?"))) return;
    setInventory(inventory.filter(function(i){ return i.id !== id; }));
  }

  function adjustStock(id, delta){
    setInventory(inventory.map(function(i){
      if (i.id !== id) return i;
      var nextStock = Math.max(0, Math.round((Number(i.stock) + delta) * 100) / 100);
      return Object.assign({}, i, { stock: nextStock });
    }));
  }

  return (
    <div>
      {criticalCount > 0 && (
        <div className="inv-alert">⚠ {criticalCount} insumo{criticalCount !== 1 ? "s" : ""} en nivel crítico — es momento de reabastecer.</div>
      )}

      <div className="toolbar">
        <input
          className="search-input"
          type="text"
          placeholder="Buscar insumo..."
          value={search}
          onChange={function(e){ setSearch(e.target.value); }}
        />
        <button className="btn btn-primary" onClick={openNew}>+ Nuevo insumo</button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-panel">
          <p style={{fontWeight:600}}>No hay insumos que coincidan</p>
          <p style={{fontSize:12.5, marginTop:4}}>Ajusta la búsqueda o agrega un nuevo insumo.</p>
        </div>
      ) : (
        <div className="dish-grid">
          {filtered.map(function(item){
            return (
              <InventoryCard
                key={item.id}
                item={item}
                onAdjust={adjustStock}
                onEdit={openEdit}
                onDelete={handleDelete}
              />
            );
          })}
        </div>
      )}

      {modalOpen && (
        <InventoryModal
          editing={editingItem}
          onClose={function(){ setModalOpen(false); }}
          onSave={handleSave}
        />
      )}
    </div>
  );
}

function MesasModule(props){
  var dishes = props.dishes;
  var orders = props.orders;
  var setOrders = props.setOrders;
  var tables = props.tables;
  var onCobrar = props.onCobrar;
  var categories = props.categories || [];
  var settings = props.settings || {};
  var currentEmployeeName = props.currentEmployeeName || "";

  var [openingTable, setOpeningTable] = useState(null);
  var [appendingOrder, setAppendingOrder] = useState(null);
  var [viewingOrder, setViewingOrder] = useState(null);
  var [, setTick] = useState(0);

  useEffect(function(){
    var interval = setInterval(function(){ setTick(function(t){ return t + 1; }); }, 15000);
    return function(){ clearInterval(interval); };
  }, []);

  function activeOrderForTable(table){
    return orders.find(function(o){ return o.tableId === table.id && (o.status === "en_cocina" || o.status === "listo"); }) || null;
  }

  function handleSend(order){
    setOrders(orders.concat([order]));
    setOpeningTable(null);
  }

  function handleAppendItems(newItems){
    var orderId = appendingOrder.id;
    setOrders(orders.map(function(o){
      if (o.id !== orderId) return o;
      return Object.assign({}, o, {
        items: o.items.concat(newItems),
        status: "en_cocina",
        kitchenReady: false,
        barReady: false
      });
    }));
    setAppendingOrder(null);
  }

  if (openingTable){
    return (
      <OrderBuilder
        dishes={dishes}
        categories={categories}
        onSend={handleSend}
        onCancel={function(){ setOpeningTable(null); }}
        lockOrderType="Mesa"
        presetTableNumber={openingTable.number}
        tableId={openingTable.id}
        currentEmployeeName={currentEmployeeName}
      />
    );
  }

  if (appendingOrder){
    return (
      <OrderBuilder
        dishes={dishes}
        categories={categories}
        onAppend={handleAppendItems}
        onCancel={function(){ setAppendingOrder(null); }}
        lockOrderType="Mesa"
        presetTableNumber={appendingOrder.tableNumber}
        tableId={appendingOrder.tableId}
        currentEmployeeName={currentEmployeeName}
      />
    );
  }

  var sortedTables = tables.slice().sort(function(a,b){ return a.number - b.number; });

  return (
    <div>
      <div className="kds-legend">
        <div className="kds-legend-item"><span className="kds-dot verde"></span> Libre</div>
        <div className="kds-legend-item"><span className="kds-dot rojo"></span> Ocupada</div>
      </div>

      <div className="mesa-grid">
        {sortedTables.map(function(table){
          var order = activeOrderForTable(table);
          var total = order ? orderTotal(order) : 0;
          var late = order ? isOrderLate(order, settings.lateOrderMinutes) : false;
          return (
            <div key={table.id} className={"mesa-card" + (order ? " ocupada" : " libre") + (late ? " order-card-late" : "")}>
              <div className="mesa-top">
                <div className="mesa-number">Mesa {table.number}</div>
                {late ? (
                  <span className="mesa-status-badge late">⚠ Atrasada</span>
                ) : (
                  <span className={"mesa-status-badge" + (order ? " ocupada" : " libre")}>{order ? "Ocupada" : "Libre"}</span>
                )}
              </div>
              <div className="mesa-seats">{table.seats} lugares</div>

              {order ? (
                <div>
                  <div className="mesa-order-meta">{order.items.length} platillo{order.items.length !== 1 ? "s" : ""} · hace {timeAgo(order.createdAt)}</div>
                  <div className="mesa-order-total">{money(total)}</div>
                  <div className="mesa-actions">
                    <button className="btn btn-ghost" onClick={function(){ setViewingOrder(order); }}>Ver comanda</button>
                    <button className="btn btn-ghost" onClick={function(){ setAppendingOrder(order); }}>+ Agregar</button>
                    <button className="btn btn-primary" onClick={function(){ onCobrar(order.id); }}>Cobrar</button>
                  </div>
                </div>
              ) : (
                <div className="mesa-actions">
                  <button className="btn btn-primary" onClick={function(){ setOpeningTable(table); }}>Abrir mesa</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {viewingOrder && (
        <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) setViewingOrder(null); }}>
          <div className="modal">
            <h3>Mesa {viewingOrder.tableNumber}</h3>
            <div className="order-items-preview" style={{fontSize:13.5}}>
              {viewingOrder.items.map(function(it, i){
                return (
                  <div key={i} style={{marginBottom:6}}>
                    {it.qty} × {it.name}
                    {it.modifiers.length > 0 && (
                      <div className="cart-item-mods">{it.modifiers.map(function(m){ return m.name; }).join(", ")}</div>
                    )}
                    {it.note && (
                      <div className="kds-item-note">📝 {it.note}</div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="cart-total-row">
              <span>Total</span>
              <span className="cart-total-value">{money(orderTotal(viewingOrder))}</span>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={function(){ setViewingOrder(null); }}>Cerrar</button>
              <button className="btn btn-primary" onClick={function(){ setViewingOrder(null); onCobrar(viewingOrder.id); }}>Cobrar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ComandasModule(props){
  var dishes = props.dishes;
  var orders = props.orders;
  var setOrders = props.setOrders;
  var customers = props.customers || [];
  var setCustomers = props.setCustomers;
  var categories = props.categories || [];
  var tables = props.tables || [];
  var settings = props.settings || {};
  var currentEmployeeName = props.currentEmployeeName || "";

  var [building, setBuilding] = useState(false);
  var [showAll, setShowAll] = useState(false);
  var [, setTick] = useState(0);
  var [pinPrompt, setPinPrompt] = useState(null);

  function requestPin(actionLabel, masterPin, onSuccess){
    setPinPrompt({ actionLabel: actionLabel, masterPin: masterPin, onSuccess: onSuccess });
  }

  useEffect(function(){
    var interval = setInterval(function(){ setTick(function(t){ return t + 1; }); }, 15000);
    return function(){ clearInterval(interval); };
  }, []);

  function handleSend(order){
    if (order.type === "Mesa" && order.tableId){
      var existing = orders.find(function(o){ return o.tableId === order.tableId && (o.status === "en_cocina" || o.status === "listo"); });
      if (existing){
        setOrders(orders.map(function(o){
          if (o.id !== existing.id) return o;
          var mergedDiscount = (Number(o.discountAmount) || 0) + (Number(order.discountAmount) || 0);
          var mergedLabel = [o.discountLabel, order.discountLabel].filter(Boolean).join(" + ");
          return Object.assign({}, o, {
            items: o.items.concat(order.items),
            discountAmount: mergedDiscount,
            discountLabel: mergedLabel,
            status: "en_cocina",
            kitchenReady: false,
            barReady: false
          });
        }));
        setBuilding(false);
        return;
      }
    }
    setOrders(orders.concat([order]));
    if (setCustomers && order.type !== "Mesa" && order.customerName){
      var exists = customers.some(function(c){ return c.name.toLowerCase() === order.customerName.toLowerCase(); });
      if (!exists){
        setCustomers(customers.concat([{
          id: uid(),
          name: order.customerName,
          phone: order.customerPhone || "",
          address: order.customerAddress || "",
          notes: ""
        }]));
      }
    }
    setBuilding(false);
  }

  function cancelOrder(id){
    requestPin("Cancelar esta comanda", settings.cancelPin, function(who){
      setOrders(orders.map(function(o){ return o.id === id ? Object.assign({}, o, {status:"cancelada", cancelledBy: who, cancelledAt: new Date().toISOString()}) : o; }));
    });
  }

  if (building){
    return <OrderBuilder dishes={dishes} categories={categories} onSend={handleSend} onCancel={function(){ setBuilding(false); }} customers={customers} tables={tables} orders={orders} settings={settings} currentEmployeeName={currentEmployeeName} />;
  }

  var activeOrders = orders.filter(function(o){ return o.status === "en_cocina" || o.status === "listo"; });
  var visibleOrders = showAll ? orders : activeOrders;
  var sorted = visibleOrders.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });

  return (
    <div>
      <div className="toolbar">
        <label className="sales-check" style={{flex:1}}>
          <input type="checkbox" checked={showAll} onChange={function(e){ setShowAll(e.target.checked); }} />
          Mostrar pagadas y canceladas
        </label>
        <button className="btn btn-primary" onClick={function(){ setBuilding(true); }}>+ Nueva comanda</button>
      </div>

      {sorted.length === 0 ? (
        <div className="empty-panel">
          <p style={{fontWeight:600}}>{showAll ? "Todavía no hay comandas" : "No hay comandas activas"}</p>
          <p style={{fontSize:12.5, marginTop:4}}>{showAll ? 'Crea la primera con "+ Nueva comanda".' : "Las comandas pagadas y canceladas se limpian de aquí automáticamente."}</p>
        </div>
      ) : (
        <div className="orders-grid">
          {sorted.map(function(order){
            var total = orderTotal(order);
            var statusMap = {
              en_cocina: { label:"En cocina", cls:"en-cocina" },
              listo: { label:"Listo", cls:"listo" },
              pagada: { label:"Pagada", cls:"pagada" },
              cancelada: { label:"Cancelada", cls:"cancelada" }
            };
            var meta = statusMap[order.status] || statusMap.cancelada;
            var late = isOrderLate(order, settings.lateOrderMinutes);
            return (
              <div key={order.id} className={"order-card status-" + order.status + (late ? " order-card-late" : "")}>
                <div className="order-top-row">
                  <div>
                    <div className="order-type-tag">{order.type}</div>
                    <div className="order-label">{orderDisplayLabel(order)}</div>
                    <div className="order-meta">{order.items.length} platillo{order.items.length !== 1 ? "s" : ""} · hace {timeAgo(order.createdAt)}</div>
                  </div>
                  {late ? (
                    <span className="order-status-badge late">⚠ Atrasada</span>
                  ) : (
                    <span className={"order-status-badge " + meta.cls}>{meta.label}</span>
                  )}
                </div>

                <div className="order-items-preview">
                  {order.items.map(function(it, i){
                    return (
                      <div key={i}>
                        {it.qty} × {it.name}
                        {it.note && <div className="kds-item-note">📝 {it.note}</div>}
                      </div>
                    );
                  })}
                  {Number(order.deliveryFee) > 0 && (
                    <div>Envío · {money(Number(order.deliveryFee))}</div>
                  )}
                  {Number(order.discountAmount) > 0 && (
                    <div>Descuento{order.discountLabel ? " (" + order.discountLabel + ")" : ""} · −{money(Number(order.discountAmount))}</div>
                  )}
                </div>

                <div className="order-total-row">
                  <span>Total</span>
                  <span className="order-total">{money(total)}</span>
                </div>

                {(order.status === "en_cocina" || order.status === "listo") && (
                  <div className="order-card-actions">
                    <button className="btn btn-danger-ghost" onClick={function(){ cancelOrder(order.id); }}>Cancelar</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {pinPrompt && (
        <PinPromptModal
          actionLabel={pinPrompt.actionLabel}
          settings={settings}
          masterPin={pinPrompt.masterPin}
          onConfirm={function(name){ var fn = pinPrompt.onSuccess; setPinPrompt(null); fn(name); }}
          onClose={function(){ setPinPrompt(null); }}
        />
      )}
    </div>
  );
}

function SalesHistoryByDay(props){
  var list = props.list || [];
  var setOrders = props.setOrders || null;
  var allOrders = props.allOrders || [];
  var settings = props.settings || {};
  var [expandedId, setExpandedId] = useState(null);
  var [pinPrompt, setPinPrompt] = useState(null);

  function requestPin(actionLabel, masterPin, onSuccess){
    setPinPrompt({ actionLabel: actionLabel, masterPin: masterPin, onSuccess: onSuccess });
  }

  async function deleteOrder(order){
    if (!(await appConfirm("¿Eliminar esta comanda de " + orderDisplayLabel(order) + " por " + money(orderTotal(order)) + "? Ya no contará como venta, pero queda registrada como eliminada."))) return;
    requestPin("Eliminar esta comanda (metida por error)", settings.cortePin, function(who){
      setOrders(allOrders.map(function(o){
        return o.id === order.id ? Object.assign({}, o, { status:"eliminada", previousStatus: o.status, deletedBy: who, deletedAt: new Date().toISOString() }) : o;
      }));
      setExpandedId(null);
    });
  }

  var groups = [];
  var byKey = {};
  list.forEach(function(o){
    var when = o.paidAt || o.createdAt;
    var key = dayKey(when);
    if (!byKey[key]){
      byKey[key] = { key:key, when:when, orders:[], total:0, count:0 };
      groups.push(byKey[key]);
    }
    byKey[key].orders.push(o);
    if (o.status === "pagada"){
      byKey[key].total += orderTotal(o);
      byKey[key].count += 1;
    }
  });

  return (
    <div>
      {groups.map(function(g){
        return (
          <div className="day-group" key={g.key}>
            <div className="day-group-header">
              <div className="day-group-title">{dayLabel(g.when)}</div>
              <div className="day-group-stats">{g.count} venta{g.count !== 1 ? "s" : ""} · <strong>{money(g.total)}</strong></div>
            </div>
            <div className="sales-table">
              <div className="sales-table-head">
                <div>Fecha / hora</div>
                <div>Cliente / mesa</div>
                <div>Método de pago</div>
                <div style={{textAlign:"right"}}>Total</div>
                <div style={{textAlign:"center"}}>Estado</div>
              </div>
              {g.orders.map(function(o){
                var isOpen = expandedId === o.id;
                var when = o.paidAt || o.createdAt;
                return (
                  <React.Fragment key={o.id}>
                    <div
                      className={"sales-row" + (o.status !== "pagada" ? " cancelada" : "")}
                      onClick={function(){ setExpandedId(isOpen ? null : o.id); }}
                    >
                      <div className="sales-time">
                        {new Date(when).toLocaleDateString("es-MX", { day:"2-digit", month:"short" })}
                        {" · "}{entryTimeLabel(when)}
                      </div>
                      <div className="sales-label-col">
                        <div className="sales-label">{orderDisplayLabel(o)}</div>
                        <div className="sales-sub">
                          {o.type} · {o.items.length} platillo{o.items.length !== 1 ? "s" : ""}
                          {o.status === "cancelada" && o.cancelledBy ? " · Canceló: " + o.cancelledBy : ""}
                          {o.status === "eliminada" && o.deletedBy ? " · Eliminó: " + o.deletedBy : ""}
                          {o.status === "pagada" && o.paidBy ? " · Cobró: " + o.paidBy : ""}
                        </div>
                      </div>
                      <div className="sales-method">{o.status === "pagada" ? (o.paymentMethod || "Efectivo") : "—"}</div>
                      <div className="sales-total">{money(orderTotal(o))}</div>
                      <div>
                        <span className={"sales-status-badge " + (o.status === "pagada" ? "pagada" : (o.status === "eliminada" ? "eliminada" : "cancelada"))}>
                          {o.status === "pagada" ? "Pagada" : (o.status === "eliminada" ? "Eliminada" : "Cancelada")}
                        </span>
                      </div>
                    </div>
                    {isOpen && (
                      <div className="sales-detail">
                        {o.items.map(function(it, i){
                          var modsTotal = it.modifiers.reduce(function(s,m){ return s + Number(m.price); }, 0);
                          var lineTotal = (Number(it.price) + modsTotal) * it.qty;
                          return (
                            <div key={i}>
                              <div className="sales-detail-item">
                                <span>{it.qty} × {it.name}{it.modifiers.length > 0 ? " (" + it.modifiers.map(function(m){ return m.name; }).join(", ") + ")" : ""}</span>
                                <span>{money(lineTotal)}</span>
                              </div>
                              {it.note && <div className="kds-item-note" style={{marginLeft:0}}>📝 {it.note}</div>}
                            </div>
                          );
                        })}
                        {Number(o.discountAmount) > 0 && (
                          <div className="sales-detail-item">
                            <span>Descuento{o.discountLabel ? " (" + o.discountLabel + ")" : ""}</span>
                            <span>−{money(Number(o.discountAmount))}</span>
                          </div>
                        )}
                        {Number(o.deliveryFee) > 0 && (
                          <div className="sales-detail-item">
                            <span>Envío</span>
                            <span>{money(Number(o.deliveryFee))}</span>
                          </div>
                        )}
                        {Number(o.tipAmount) > 0 && (
                          <div className="sales-detail-item">
                            <span>Propina</span>
                            <span>{money(Number(o.tipAmount))}</span>
                          </div>
                        )}
                        {setOrders && o.status !== "eliminada" && (
                          <button
                            className="btn btn-danger-ghost"
                            style={{marginTop:10}}
                            onClick={function(e){ e.stopPropagation(); deleteOrder(o); }}
                          >
                            🗑 Eliminar comanda (metida por error)
                          </button>
                        )}
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          </div>
        );
      })}

      {pinPrompt && (
        <PinPromptModal
          actionLabel={pinPrompt.actionLabel}
          settings={settings}
          masterPin={pinPrompt.masterPin}
          onConfirm={function(name){ var fn = pinPrompt.onSuccess; setPinPrompt(null); fn(name); }}
          onClose={function(){ setPinPrompt(null); }}
        />
      )}
    </div>
  );
}

function CajaModule(props){
  var orders = props.orders;
  var setOrders = props.setOrders;
  var focusOrderId = props.focusOrderId;
  var clearFocus = props.clearFocus;
  var settings = props.settings || {};
  var cortes = props.cortes || [];
  var setCortes = props.setCortes;
  var customers = props.customers || [];
  var setCustomers = props.setCustomers;
  var currentEmployeeName = props.currentEmployeeName || "";

  var [tab, setTab] = useState("cobrar");
  var [charging, setCharging] = useState(null);
  var [chargingItems, setChargingItems] = useState([]);
  var [editingItems, setEditingItems] = useState(false);
  var [method, setMethod] = useState("Efectivo");
  var [paidByName, setPaidByName] = useState("");
  var [tipAmount, setTipAmount] = useState("");
  var [splitCount, setSplitCount] = useState(1);
  var [redeemPoints, setRedeemPoints] = useState(false);
  var [includeCanceladas, setIncludeCanceladas] = useState(false);
  var [includeEliminadas, setIncludeEliminadas] = useState(false);
  var [pinPrompt, setPinPrompt] = useState(null);

  function requestPin(actionLabel, masterPin, onSuccess){
    setPinPrompt({ actionLabel: actionLabel, masterPin: masterPin, onSuccess: onSuccess });
  }

  var porCobrar = orders.filter(function(o){ return o.status === "en_cocina" || o.status === "listo"; })
    .slice().sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });

  var startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  var lastCorte = cortes.length ? new Date(cortes[cortes.length - 1].closedAt) : null;
  var periodStart = (lastCorte && lastCorte > startOfToday) ? lastCorte : startOfToday;

  function inPeriod(iso){
    return new Date(iso) >= periodStart;
  }

  var pagadasHoy = orders.filter(function(o){ return o.status === "pagada" && inPeriod(o.paidAt || o.createdAt); });
  var canceladasHoy = orders.filter(function(o){ return o.status === "cancelada" && inPeriod(o.createdAt); });

  var totalHoy = pagadasHoy.reduce(function(s,o){ return s + orderTotal(o); }, 0);
  var propinasHoy = pagadasHoy.reduce(function(s,o){ return s + (Number(o.tipAmount) || 0); }, 0);
  var domiciliosHoy = pagadasHoy.filter(function(o){ return o.type === "Domicilio"; }).length;
  var porMetodo = {};
  PAYMENT_METHODS.forEach(function(m){ porMetodo[m] = { total:0, count:0 }; });
  pagadasHoy.forEach(function(o){
    var m = o.paymentMethod || "Efectivo";
    if (!porMetodo[m]) porMetodo[m] = { total:0, count:0 };
    porMetodo[m].total += orderTotal(o);
    porMetodo[m].count += 1;
  });

  var todasPagadas = orders.filter(function(o){ return o.status === "pagada"; });
  var todasCanceladas = orders.filter(function(o){ return o.status === "cancelada"; });
  var todasEliminadas = orders.filter(function(o){ return o.status === "eliminada"; });
  var historyList = todasPagadas
    .concat(includeCanceladas ? todasCanceladas : [])
    .concat(includeEliminadas ? todasEliminadas : [])
    .slice()
    .sort(function(a,b){ return new Date(b.paidAt || b.createdAt) - new Date(a.paidAt || a.createdAt); });

  useEffect(function(){
    if (!focusOrderId) return;
    var found = orders.find(function(o){ return o.id === focusOrderId && (o.status === "en_cocina" || o.status === "listo"); });
    if (found){
      openCharge(found);
      setTab("cobrar");
    }
    if (clearFocus) clearFocus();
    // eslint-disable-next-line
  }, [focusOrderId]);

  function openCharge(order){
    setCharging(order);
    setChargingItems(order.items.map(function(it){ return Object.assign({}, it); }));
    setEditingItems(false);
    setMethod("Efectivo");
    setPaidByName(currentEmployeeName || ((settings.employees && settings.employees[0]) ? settings.employees[0].name : ""));
    setTipAmount("");
    setSplitCount(1);
    setRedeemPoints(false);
  }

  function chargeItemsSubtotal(){
    return chargingItems.reduce(function(sum, item){
      var modsTotal = (item.modifiers || []).reduce(function(s, m){ return s + Number(m.price); }, 0);
      return sum + (Number(item.price) + modsTotal) * item.qty;
    }, 0);
  }

  function chargeChangeQty(idx, delta){
    var next = chargingItems.slice();
    var newQty = next[idx].qty + delta;
    if (newQty <= 0){
      next.splice(idx, 1);
    } else {
      next[idx] = Object.assign({}, next[idx], { qty: newQty });
    }
    setChargingItems(next);
  }

  function chargeRemoveItem(idx){
    setChargingItems(chargingItems.filter(function(c, i){ return i !== idx; }));
  }

  async function chargeEditNote(idx){
    var current = chargingItems[idx].note || "";
    var note = await appPrompt("Nota para \"" + chargingItems[idx].name + "\" (ej. sin cebollín, extra picante):", current);
    if (note === null) return;
    var next = chargingItems.slice();
    next[idx] = Object.assign({}, next[idx], { note: note.trim() });
    setChargingItems(next);
  }

  function cancelOrder(id){
    requestPin("Cancelar esta comanda", settings.cancelPin, function(who){
      setOrders(orders.map(function(o){ return o.id === id ? Object.assign({}, o, {status:"cancelada", cancelledBy: who, cancelledAt: new Date().toISOString()}) : o; }));
    });
  }

  async function deleteOrderMaster(order){
    if (!(await appConfirm("¿Eliminar esta comanda de " + orderDisplayLabel(order) + "? Ya no contará como venta, pero queda registrada como eliminada."))) return;
    requestPin("Eliminar esta comanda (metida por error)", settings.cortePin, function(who){
      setOrders(orders.map(function(o){
        return o.id === order.id ? Object.assign({}, o, { status:"eliminada", previousStatus: o.status, deletedBy: who, deletedAt: new Date().toISOString() }) : o;
      }));
    });
  }

  async function restoreOrder(order){
    if (!(await appConfirm("¿Restaurar esta comanda de " + orderDisplayLabel(order) + " por " + money(orderTotal(order)) + "? Volverá a contar como estaba antes de eliminarse."))) return;
    requestPin("Restaurar esta comanda", settings.cortePin, function(who){
      setOrders(orders.map(function(o){
        if (o.id !== order.id) return o;
        var restored = Object.assign({}, o, { status: o.previousStatus || "cancelada", restoredBy: who, restoredAt: new Date().toISOString() });
        delete restored.previousStatus;
        return restored;
      }));
    });
  }

  var chargingCustomer = (charging && charging.customerName)
    ? customers.find(function(c){ return c.name.toLowerCase() === charging.customerName.toLowerCase(); })
    : null;
  var redeemPointsCost = Number(settings.loyaltyRedeemPoints) || 0;
  var redeemValue = Number(settings.loyaltyRedeemValue) || 0;
  var canRedeem = !!(settings.loyaltyEnabled && chargingCustomer && redeemPointsCost > 0 && (chargingCustomer.points || 0) >= redeemPointsCost);
  var loyaltyDiscount = (redeemPoints && canRedeem) ? redeemValue : 0;

  function total(){
    if (!charging) return 0;
    var itemsTotal = chargeItemsSubtotal();
    var afterDiscount = itemsTotal - (Number(charging.discountAmount) || 0) - loyaltyDiscount;
    if (afterDiscount < 0) afterDiscount = 0;
    return afterDiscount + (Number(charging.deliveryFee) || 0);
  }

  function canConfirm(){
    return !!charging;
  }

  function confirmCharge(){
    if (!canConfirm()) return;
    var id = charging.id;
    var tip = Number(tipAmount) || 0;
    if (tip < 0) tip = 0;
    var appliedLoyaltyDiscount = loyaltyDiscount;
    var earnRate = Number(settings.loyaltyEarnRate) || 0;
    var pointsEarned = (settings.loyaltyEnabled && earnRate > 0) ? Math.floor(total() / earnRate) : 0;

    setOrders(orders.map(function(o){
      if (o.id !== id) return o;
      return Object.assign({}, o, {
        items: chargingItems,
        status:"pagada",
        paymentMethod: method,
        paidBy: paidByName || "",
        tipAmount: tip,
        loyaltyDiscount: appliedLoyaltyDiscount,
        pointsEarned: pointsEarned,
        pointsRedeemed: appliedLoyaltyDiscount > 0 ? redeemPointsCost : 0,
        paidAt: new Date().toISOString()
      });
    }));

    if (setCustomers && chargingCustomer && (pointsEarned > 0 || appliedLoyaltyDiscount > 0)){
      setCustomers(customers.map(function(c){
        if (c.id !== chargingCustomer.id) return c;
        var current = c.points || 0;
        var next = current - (appliedLoyaltyDiscount > 0 ? redeemPointsCost : 0) + pointsEarned;
        return Object.assign({}, c, { points: next < 0 ? 0 : next });
      }));
    }

    setCharging(null);
  }

  async function realizarCorte(){
    if (!setCortes) return;
    if (pagadasHoy.length === 0 && canceladasHoy.length === 0){
      await appAlert("No hay movimientos que cortar todavía en este periodo.");
      return;
    }
    if (!(await appConfirm("¿Confirmar corte de caja por " + money(totalHoy) + "? El contador se reiniciará en $0.00."))) return;
    requestPin("Realizar el corte de caja", settings.cortePin, function(who){
      var snapshot = {
        id: uid(),
        closedAt: new Date().toISOString(),
        total: totalHoy,
        totalPropinas: propinasHoy,
        comandasCobradas: pagadasHoy.length,
        comandasCanceladas: canceladasHoy.length,
        domiciliosCobrados: domiciliosHoy,
        closedBy: who,
        porMetodo: PAYMENT_METHODS.map(function(m){ return { metodo:m, total: porMetodo[m].total, count: porMetodo[m].count }; })
      };
      setCortes(cortes.concat([snapshot]));
    });
  }

  var historial = cortes.slice().sort(function(a,b){ return new Date(b.closedAt) - new Date(a.closedAt); }).slice(0, 10);

  return (
    <div>
      <div className="cat-tabs">
        <div className={"cat-tab" + (tab === "cobrar" ? " active" : "")} onClick={function(){ setTab("cobrar"); }}>Por cobrar ({porCobrar.length})</div>
        <div className={"cat-tab" + (tab === "corte" ? " active" : "")} onClick={function(){ setTab("corte"); }}>Corte del día</div>
        <div className={"cat-tab" + (tab === "historial" ? " active" : "")} onClick={function(){ setTab("historial"); }}>Historial de ventas</div>
        <div className={"cat-tab" + (tab === "papelera" ? " active" : "")} onClick={function(){ setTab("papelera"); }}>🗑 Papelera ({todasEliminadas.length})</div>
      </div>

      {tab === "cobrar" && (
        porCobrar.length === 0 ? (
          <div className="empty-panel">
            <p style={{fontWeight:600}}>No hay comandas pendientes de cobro</p>
            <p style={{fontSize:12.5, marginTop:4}}>Las comandas enviadas a cocina aparecerán aquí para cerrarlas.</p>
          </div>
        ) : (
          <div className="orders-grid">
            {porCobrar.map(function(order){
              var t = orderTotal(order);
              return (
                <div key={order.id} className={"order-card status-" + order.status}>
                  <div className="order-top-row">
                    <div>
                      <div className="order-type-tag">{order.type}</div>
                      <div className="order-label">{orderDisplayLabel(order)}</div>
                      <div className="order-meta">{order.items.length} platillo{order.items.length !== 1 ? "s" : ""} · hace {timeAgo(order.createdAt)}</div>
                    </div>
                    <span className={"order-status-badge " + (order.status === "listo" ? "listo" : "en-cocina")}>{order.status === "listo" ? "Listo" : "En cocina"}</span>
                  </div>
                  <div className="order-total-row">
                    <span>Total</span>
                    <span className="order-total">{money(t)}</span>
                  </div>
                  <div className="order-card-actions">
                    <button className="btn btn-danger-ghost" onClick={function(){ cancelOrder(order.id); }}>Cancelar</button>
                    <button className="btn btn-danger-ghost" onClick={function(){ deleteOrderMaster(order); }}>🗑 Eliminar</button>
                    <button className="btn btn-primary" onClick={function(){ openCharge(order); }}>Cobrar</button>
                  </div>
                </div>
              );
            })}
          </div>
        )
      )}

      {tab === "corte" && (
        <div>
          <div className="toolbar" style={{marginBottom:14}}>
            <div style={{flex:1, fontSize:12.5, color:"var(--ink-600)"}}>
              {(lastCorte && lastCorte > startOfToday
                ? "Periodo actual (turno) desde el último corte · " + entryTimeLabel(periodStart.toISOString())
                : "Periodo actual (turno) desde el inicio del día")
                + " — para ver el total del día completo, revisa Reportes → Hoy."}
            </div>
            <button className="btn btn-primary" onClick={realizarCorte}>🔒 Realizar corte de caja</button>
          </div>

          <div className="stat-grid">
            <div className="stat-card">
              <div className="stat-label">Ventas del periodo</div>
              <div className="stat-value accent">{money(totalHoy)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Propinas del periodo</div>
              <div className="stat-value">{money(propinasHoy)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Comandas cobradas</div>
              <div className="stat-value">{pagadasHoy.length}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Comandas canceladas</div>
              <div className="stat-value">{canceladasHoy.length}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Envíos a domicilio</div>
              <div className="stat-value">{domiciliosHoy}</div>
            </div>
          </div>

          <div className="corte-metodos">
            {PAYMENT_METHODS.map(function(m){
              return (
                <div key={m} className="corte-metodo-row">
                  <span>{m}</span>
                  <span className="corte-metodo-count">{porMetodo[m].count} comanda{porMetodo[m].count !== 1 ? "s" : ""}</span>
                  <span className="corte-metodo-total">{money(porMetodo[m].total)}</span>
                </div>
              );
            })}
          </div>

          {historial.length > 0 && (
            <div style={{marginTop:26}}>
              <h4 style={{margin:"0 0 10px 0"}}>Cortes anteriores</h4>
              <div className="corte-metodos">
                {historial.map(function(c){
                  return (
                    <div key={c.id} className="corte-metodo-row">
                      <span>{new Date(c.closedAt).toLocaleString("es-MX", { dateStyle:"medium", timeStyle:"short" })}{c.closedBy ? " · " + c.closedBy : ""}</span>
                      <span className="corte-metodo-count">{c.comandasCobradas} cobradas · {c.comandasCanceladas} canceladas{Number(c.domiciliosCobrados) > 0 ? " · " + c.domiciliosCobrados + " envío" + (c.domiciliosCobrados !== 1 ? "s" : "") : ""}{Number(c.totalPropinas) > 0 ? " · propinas " + money(c.totalPropinas) : ""}</span>
                      <span className="corte-metodo-total">{money(c.total)}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {tab === "papelera" && (
        <div>
          <div className="sales-toolbar">
            <div style={{flex:1, fontSize:12.5, color:"var(--ink-600)"}}>{todasEliminadas.length} comanda{todasEliminadas.length !== 1 ? "s" : ""} eliminada{todasEliminadas.length !== 1 ? "s" : ""}</div>
          </div>
          {todasEliminadas.length === 0 ? (
            <div className="empty-panel">
              <p style={{fontWeight:600}}>La papelera está vacía</p>
              <p style={{fontSize:12.5, marginTop:4}}>Las comandas que elimines por error (con la contraseña maestra) aparecerán aquí, para tener registro de quién y cuándo — y puedes restaurarlas si fue un error.</p>
            </div>
          ) : (
            <div className="sales-table">
              <div className="sales-table-head">
                <div>Fecha / hora</div>
                <div>Cliente / mesa</div>
                <div>Eliminó</div>
                <div style={{textAlign:"right"}}>Hubiera sido</div>
                <div style={{textAlign:"center"}}>Estado</div>
              </div>
              {todasEliminadas
                .slice()
                .sort(function(a,b){ return new Date(b.deletedAt || b.createdAt) - new Date(a.deletedAt || a.createdAt); })
                .map(function(o){
                  var when = o.deletedAt || o.createdAt;
                  return (
                    <div className="sales-row cancelada" key={o.id}>
                      <div className="sales-time">
                        {new Date(when).toLocaleDateString("es-MX", { day:"2-digit", month:"short" })}
                        {" · "}{entryTimeLabel(when)}
                      </div>
                      <div className="sales-label-col">
                        <div className="sales-label">{orderDisplayLabel(o)}</div>
                        <div className="sales-sub">{o.type} · {o.items.length} platillo{o.items.length !== 1 ? "s" : ""}</div>
                      </div>
                      <div className="sales-method">{o.deletedBy || "—"}</div>
                      <div className="sales-total">{money(orderTotal(o))}</div>
                      <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:6}}>
                        <span className="sales-status-badge eliminada">Eliminada</span>
                        {setOrders && (
                          <button
                            type="button"
                            className="btn btn-ghost"
                            style={{padding:"3px 10px", fontSize:11.5}}
                            onClick={function(){ restoreOrder(o); }}
                          >
                            ↺ Restaurar
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
            </div>
          )}
        </div>
      )}

      {tab === "historial" && (
        <div>
          <div className="sales-toolbar">
            <div style={{flex:1, fontSize:12.5, color:"var(--ink-600)"}}>{historyList.length} venta{historyList.length !== 1 ? "s" : ""} en total</div>
            <label className="sales-check">
              <input type="checkbox" checked={includeCanceladas} onChange={function(e){ setIncludeCanceladas(e.target.checked); }} />
              Incluir canceladas
            </label>
            <label className="sales-check">
              <input type="checkbox" checked={includeEliminadas} onChange={function(e){ setIncludeEliminadas(e.target.checked); }} />
              Incluir eliminadas
            </label>
            <button
              className="btn btn-ghost"
              disabled={historyList.length === 0}
              onClick={function(){ exportOrdersToCSV(historyList, "historial-ventas-" + new Date().toISOString().slice(0,10) + ".csv"); }}
            >
              ⬇ Exportar a Excel
            </button>
          </div>

          {historyList.length === 0 ? (
            <div className="empty-panel">
              <p style={{fontWeight:600}}>Todavía no hay ventas registradas</p>
              <p style={{fontSize:12.5, marginTop:4}}>Las comandas que cobres aquí aparecerán en este historial.</p>
            </div>
          ) : (
            <SalesHistoryByDay list={historyList} setOrders={setOrders} allOrders={orders} settings={settings} />
          )}
        </div>
      )}

      {charging && (
        <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) setCharging(null); }}>
          <div className="modal">
            <h3>Cobrar {orderDisplayLabel(charging)}</h3>

            {settings.loyaltyEnabled && chargingCustomer && (
              <div className="loyalty-box">
                <div>🎁 {chargingCustomer.name} tiene <strong>{chargingCustomer.points || 0} puntos</strong></div>
                {canRedeem ? (
                  <label className="sales-check" style={{marginTop:6}}>
                    <input type="checkbox" checked={redeemPoints} onChange={function(e){ setRedeemPoints(e.target.checked); }} />
                    Canjear {redeemPointsCost} puntos por {money(redeemValue)} de descuento
                  </label>
                ) : (
                  <div style={{fontSize:11.5, marginTop:4, color:"var(--ink-600)"}}>Necesita {redeemPointsCost} puntos para canjear (le faltan {Math.max(redeemPointsCost - (chargingCustomer.points || 0), 0)}).</div>
                )}
              </div>
            )}

            <div style={{margin:"10px 0"}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <label style={{margin:0}}>Platillos</label>
                <button
                  type="button"
                  className="btn btn-ghost"
                  style={{padding:"3px 10px", fontSize:11.5}}
                  onClick={function(){ setEditingItems(!editingItems); }}
                >
                  {editingItems ? "Listo" : "✎ Modificar"}
                </button>
              </div>
              {chargingItems.length === 0 ? (
                <p style={{fontSize:12.5, color:"var(--ink-600)"}}>Sin platillos en esta comanda.</p>
              ) : (
                chargingItems.map(function(item, idx){
                  var modsTotal = (item.modifiers || []).reduce(function(s, m){ return s + Number(m.price); }, 0);
                  var lineTotal = (Number(item.price) + modsTotal) * item.qty;
                  return (
                    <div className="cart-item" key={idx}>
                      <div className="cart-item-top">
                        <div className="cart-item-name">{item.qty} × {item.name}</div>
                        <div className="cart-item-price">{money(lineTotal)}</div>
                      </div>
                      {item.modifiers && item.modifiers.length > 0 && (
                        <div className="cart-item-mods">
                          {item.modifiers.map(function(m){ return m.name; }).join(", ")}
                        </div>
                      )}
                      {item.note && (
                        <div className="cart-item-note">📝 {item.note}</div>
                      )}
                      {editingItems && (
                        <div>
                          <div className="qty-stepper">
                            <button className="qty-btn" onClick={function(){ chargeChangeQty(idx, -1); }}>−</button>
                            <span className="qty-val">{item.qty}</span>
                            <button className="qty-btn" onClick={function(){ chargeChangeQty(idx, 1); }}>+</button>
                          </div>
                          <button className="cart-item-remove" onClick={function(){ chargeEditNote(idx); }}>{item.note ? "Editar nota" : "+ Nota"}</button>
                          <button className="cart-item-remove" onClick={function(){ chargeRemoveItem(idx); }}>Quitar</button>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>

            {Number(charging.discountAmount) > 0 && (
              <div className="cart-total-row" style={{fontSize:13, color:"var(--umeboshi-500)"}}>
                <span>Descuento{charging.discountLabel ? " (" + charging.discountLabel + ")" : ""}</span>
                <span>−{money(Number(charging.discountAmount))}</span>
              </div>
            )}
            {Number(charging.deliveryFee) > 0 && (
              <div className="cart-total-row" style={{fontSize:13, color:"var(--ink-600)"}}>
                <span>Envío</span>
                <span>{money(Number(charging.deliveryFee))}</span>
              </div>
            )}

            <div className="cart-total-row" style={{marginTop:0}}>
              <span>Total a pagar</span>
              <span className="cart-total-value">{money(total())}</span>
            </div>
            {loyaltyDiscount > 0 && (
              <p style={{fontSize:12, color:"var(--umeboshi-500)", marginTop:-8, marginBottom:12}}>Incluye −{money(loyaltyDiscount)} de descuento por canje de puntos.</p>
            )}

            <div className="field-row">
              <div className="field">
                <label>Propina (opcional)</label>
                <input type="number" min="0" value={tipAmount} placeholder="0.00" onChange={function(e){ setTipAmount(e.target.value); }} />
              </div>
              <div className="field">
                <label>Dividir entre</label>
                <input
                  type="number"
                  min="1"
                  value={splitCount}
                  onChange={function(e){ var n = parseInt(e.target.value, 10); setSplitCount(n > 0 ? n : 1); }}
                />
              </div>
            </div>
            {splitCount > 1 && (
              <p style={{fontSize:12.5, color:"var(--ink-600)", marginTop:-4, marginBottom:12}}>
                {money((total() + (Number(tipAmount) || 0)) / splitCount)} por persona ({splitCount} personas) — solo como referencia, el cobro se sigue registrando como una sola cuenta.
              </p>
            )}

            <div className="field">
              <label>Método de pago</label>
              <div className="type-selector">
                {PAYMENT_METHODS.map(function(m){
                  return (
                    <div key={m} className={"type-btn" + (method === m ? " active" : "")} onClick={function(){ setMethod(m); }}>{m}</div>
                  );
                })}
              </div>
            </div>

            {currentEmployeeName ? (
              <p style={{fontSize:12.5, color:"var(--ink-600)"}}>👤 Cobrado por <strong>{currentEmployeeName}</strong> (tu turno actual)</p>
            ) : (settings.employees || []).length > 0 && (
              <div className="field">
                <label>Cobrado por</label>
                <select value={paidByName} onChange={function(e){ setPaidByName(e.target.value); }}>
                  {settings.employees.map(function(e){
                    return <option key={e.id} value={e.name}>{e.name}</option>;
                  })}
                </select>
              </div>
            )}

            {settings.loyaltyEnabled && chargingCustomer && Number(settings.loyaltyEarnRate) > 0 && (
              <p style={{fontSize:12, color:"var(--wasabi-600)", fontWeight:600}}>
                + Ganará {Math.floor(total() / Number(settings.loyaltyEarnRate))} puntos con esta compra
              </p>
            )}

            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={function(){ setCharging(null); }}>Cancelar</button>
              <button className="btn btn-primary" onClick={confirmCharge} disabled={!canConfirm()}>Confirmar cobro</button>
            </div>
          </div>
        </div>
      )}

      {pinPrompt && (
        <PinPromptModal
          actionLabel={pinPrompt.actionLabel}
          settings={settings}
          masterPin={pinPrompt.masterPin}
          onConfirm={function(name){ var fn = pinPrompt.onSuccess; setPinPrompt(null); fn(name); }}
          onClose={function(){ setPinPrompt(null); }}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Módulo de Reportes
   --------------------------------------------------------- */
function ReportesModule(props){
  var orders = props.orders;
  var dishes = props.dishes;
  var setOrders = props.setOrders || null;
  var settings = props.settings || {};
  var cortes = props.cortes || [];
  var [range, setRange] = useState("Hoy");
  var [subTab, setSubTab] = useState("resumen");
  var [includeCanceladas, setIncludeCanceladas] = useState(false);
  var [includeEliminadas, setIncludeEliminadas] = useState(false);

  var pagadas = orders.filter(function(o){ return o.status === "pagada" && inReportRange(o.paidAt || o.createdAt, range); });
  var canceladas = orders.filter(function(o){ return o.status === "cancelada" && inReportRange(o.createdAt, range); });
  var eliminadas = orders.filter(function(o){ return o.status === "eliminada" && inReportRange(o.deletedAt || o.createdAt, range); });

  // Reconciliación con Caja: "Hoy" aquí es el día calendario completo, mientras que Caja
  // muestra solo el turno abierto desde el último corte. Para que no se vean como cifras
  // contradictorias, desglosamos "Hoy" en los cortes ya hechos + el turno actual sin cortar.
  var startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  var lastCorte = cortes.length ? new Date(cortes[cortes.length - 1].closedAt) : null;
  var periodStart = (lastCorte && lastCorte > startOfToday) ? lastCorte : startOfToday;
  var cortesHoy = cortes
    .filter(function(c){ return new Date(c.closedAt) >= startOfToday; })
    .slice()
    .sort(function(a,b){ return new Date(a.closedAt) - new Date(b.closedAt); });
  var turnoActualVentas = orders
    .filter(function(o){ return o.status === "pagada" && new Date(o.paidAt || o.createdAt) >= periodStart; })
    .reduce(function(s,o){ return s + orderTotal(o); }, 0);

  var totalVentas = pagadas.reduce(function(s,o){ return s + orderTotal(o); }, 0);
  var totalPropinasRango = pagadas.reduce(function(s,o){ return s + (Number(o.tipAmount) || 0); }, 0);
  var ticketProm = pagadas.length ? totalVentas / pagadas.length : 0;

  var dishById = {};
  dishes.forEach(function(d){ dishById[d.id] = d; });

  var dishStats = {};
  var catStats = {};
  pagadas.forEach(function(o){
    o.items.forEach(function(it){
      var modsTotal = it.modifiers.reduce(function(s,m){ return s + Number(m.price); }, 0);
      var lineTotal = (Number(it.price) + modsTotal) * it.qty;
      if (!dishStats[it.name]) dishStats[it.name] = { qty:0, revenue:0 };
      dishStats[it.name].qty += it.qty;
      dishStats[it.name].revenue += lineTotal;

      var dish = dishById[it.dishId];
      var cat = dish ? dish.category : "Otros";
      if (!catStats[cat]) catStats[cat] = 0;
      catStats[cat] += lineTotal;
    });
  });

  var topDishes = Object.keys(dishStats).map(function(name){ return Object.assign({ name:name }, dishStats[name]); })
    .sort(function(a,b){ return b.qty - a.qty; }).slice(0, 5);
  var maxQty = topDishes.length ? topDishes[0].qty : 1;

  var catList = Object.keys(catStats).map(function(c){ return { category:c, total:catStats[c] }; })
    .sort(function(a,b){ return b.total - a.total; });
  var maxCat = catList.length ? catList[0].total : 1;

  var porMetodo = {};
  PAYMENT_METHODS.forEach(function(m){ porMetodo[m] = { total:0, count:0 }; });
  pagadas.forEach(function(o){
    var m = o.paymentMethod || "Efectivo";
    if (!porMetodo[m]) porMetodo[m] = { total:0, count:0 };
    porMetodo[m].total += orderTotal(o);
    porMetodo[m].count += 1;
  });

  var porTipo = {};
  ORDER_TYPES.forEach(function(t){ porTipo[t] = { total:0, count:0 }; });
  pagadas.forEach(function(o){
    if (!porTipo[o.type]) porTipo[o.type] = { total:0, count:0 };
    porTipo[o.type].total += orderTotal(o);
    porTipo[o.type].count += 1;
  });

  var historyList = pagadas

          {historyList.length === 0 ? (

      {range === "Hoy" && (
        <div className="report-panel" style={{marginBottom:20}}>
          <h4>¿Por qué no coincide con Caja?</h4>
          <p style={{fontSize:12.5, color:"var(--ink-600)", margin:"0 0 14px 0"}}>
            Aquí "Hoy" suma todo el día calendario. En Caja, "Periodo actual" solo muestra el turno abierto desde el último corte — por eso pueden verse distintos si ya hiciste uno o más cortes hoy. Este es el desglose que sí debe sumar {money(totalVentas)}:

          <div style={{border:"1px solid #14100C10", borderRadius:12, overflow:"hidden"}}>
            {cortesHoy.map(function(c, i){
              return (
                <div key={c.id} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 16px", borderBottom:"1px solid #14100C0F"}}>
                  <div>
                    <div style={{fontWeight:600, fontSize:13}}>Corte · {entryTimeLabel(c.closedAt)}</div>
                    <div style={{fontSize:12, color:"var(--ink-600)"}}>{c.closedBy || "—"} · {c.comandasCobradas} cobradas</div>
                  </div>
                  <div style={{fontWeight:700}}>{money(c.total)}</div>

              );
            })}
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 16px", background:"#14100C05"}}>
              <div>

function CustomerModal(props){
  var editing = props.editing;
  var onClose = props.onClose;
  var onSave = props.onSave;

  var blank = { id:null, name:"", phone:"", address:"", notes:"" };
  var initial = editing ? Object.assign({}, editing) : blank;
  var [form, setForm] = useState(initial);

  function updateField(key, value){
    var next = Object.assign({}, form);
    next[key] = value;
    setForm(next);
  }

  function handleSubmit(){
    if (!form.name.trim()) return;
    onSave(Object.assign({}, form, { id: form.id || uid(), name: form.name.trim() }));
  }

  return (
    <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <h3>{editing ? "Editar cliente" : "Nuevo cliente"}</h3>
        <div className="field">
          <label>Nombre</label>
          <input type="text" value={form.name} placeholder="p. ej. Ana Torres" onChange={function(e){ updateField("name", e.target.value); }} />
        </div>
        <div className="field">
          <label>Teléfono</label>
          <input type="text" value={form.phone} placeholder="p. ej. 322 123 4567" onChange={function(e){ updateField("phone", e.target.value); }} />
        </div>
        <div className="field">
          <label>Dirección</label>
          <textarea value={form.address} placeholder="Calle, número, colonia, referencias" onChange={function(e){ updateField("address", e.target.value); }} />
        </div>
        <div className="field">
          <label>Notas</label>
          <textarea value={form.notes} placeholder="Alergias, preferencias, etc." onChange={function(e){ updateField("notes", e.target.value); }} />

function ClientesModule(props){
  var customers = props.customers;
  var setCustomers = props.setCustomers;
  var orders = props.orders;
  var setOrders = props.setOrders;

  var [tab, setTab] = useState("directorio");
  var [search, setSearch] = useState("");
  var [modalOpen, setModalOpen] = useState(false);
  var [editingCustomer, setEditingCustomer] = useState(null);
  var [historyCustomer, setHistoryCustomer] = useState(null);

  var filtered = customers.filter(function(c){
    var q = search.toLowerCase();
    return c.name.toLowerCase().indexOf(q) !== -1 || (c.phone || "").indexOf(q) !== -1;
  });

  function openNew(){ setEditingCustomer(null); setModalOpen(true); }
  function openEdit(c){ setEditingCustomer(c); setModalOpen(true); }

  function handleSave(c){
    var exists = customers.some(function(x){ return x.id === c.id; });
    var next = exists
      ? customers.map(function(x){ return x.id === c.id ? c : x; })
      : customers.concat([c]);
    setCustomers(next);
    setModalOpen(false);
  }

  async function handleDelete(id){
    if (!(await appConfirm("¿Eliminar este cliente?"))) return;
    setCustomers(customers.filter(function(x){ return x.id !== id; }));
  }

  var domicilios = orders.filter(function(o){ return o.type === "Domicilio" && o.status !== "cancelada" && o.deliveryStatus !== "entregado"; })
    .slice().sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });

  function advanceDelivery(id){
    setOrders(orders.map(function(o){
      if (o.id !== id) return o;
      return Object.assign({}, o, { deliveryStatus: nextDeliveryStage(o.deliveryStatus || "preparando") });
    }));
  }

  return (
    <div>
      <div className="cat-tabs">
        <div className={"cat-tab" + (tab === "directorio" ? " active" : "")} onClick={function(){ setTab("directorio"); }}>Directorio ({customers.length})</div>
        <div className={"cat-tab" + (tab === "domicilios" ? " active" : "")} onClick={function(){ setTab("domicilios"); }}>Domicilios en curso ({domicilios.length})</div>
      </div>

      {tab === "directorio" && (
        <div>
          <div className="toolbar">
            <input
              className="search-input"
              type="text"
              placeholder="Buscar por nombre o teléfono..."
              value={search}
              onChange={function(e){ setSearch(e.target.value); }}
            />
            <button className="btn btn-primary" onClick={openNew}>+ Nuevo cliente</button>
          </div>

          {filtered.length === 0 ? (
            <div className="empty-panel">
              <p style={{fontWeight:600}}>{customers.length === 0 ? "Todavía no hay clientes guardados" : "No hay clientes que coincidan"}</p>
              <p style={{fontSize:12.5, marginTop:4}}>Los clientes se guardan automáticamente al tomar pedidos a domicilio o para llevar, o agrégalos aquí.</p>
            </div>
          ) : (
            <div className="dish-grid">
              {filtered.map(function(c){
                return (
                  <div key={c.id} className="dish-card">
                    <div className="dish-top">
                      <div className="dish-name">{c.name}</div>
                      {Number(c.points) > 0 && (
                        <span className="mesa-status-badge libre">🎁 {c.points} pts</span>
                      )}
                    </div>
                    {c.phone && <div className="dish-desc">📞 {c.phone}</div>}
                    {c.address && <div className="dish-desc">📍 {c.address}</div>}
                    {c.notes && <div className="dish-desc">📝 {c.notes}</div>}
                    <div className="dish-actions">
                      <button className="icon-btn" onClick={function(){ setHistoryCustomer(c); }}>Historial</button>
                      <button className="icon-btn" onClick={function(){ openEdit(c); }}>Editar</button>
                      <button className="icon-btn" style={{color:"#C1443A"}} onClick={function(){ handleDelete(c.id); }}>Eliminar</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {tab === "domicilios" && (
        domicilios.length === 0 ? (
          <div className="empty-panel">
            <p style={{fontWeight:600}}>No hay domicilios en curso</p>
            <p style={{fontSize:12.5, marginTop:4}}>Los pedidos a domicilio aparecerán aquí hasta que se marquen como entregados.</p>
          </div>
        ) : (
          <div className="orders-grid">
            {domicilios.map(function(o){
              var stage = o.deliveryStatus || "preparando";
              var badgeClass = stage === "entregado" ? "pagada" : (stage === "en_camino" ? "listo" : "en-cocina");
              return (
                <div key={o.id} className="order-card">
                  <div className="order-top-row">
                    <div>
                      <div className="order-type-tag">Domicilio</div>
                      <div className="order-label">{o.customerName}</div>
                      <div className="order-meta">{o.items.length} platillo{o.items.length !== 1 ? "s" : ""} · hace {timeAgo(o.createdAt)}</div>
                    </div>
                    <span className={"order-status-badge " + badgeClass}>{DELIVERY_LABELS[stage]}</span>
                  </div>
                  {o.customerPhone && <div className="order-meta">📞 {o.customerPhone}</div>}
                  {o.customerAddress && <div className="order-meta">📍 {o.customerAddress}</div>}
                  <div className="order-card-actions">
                    {stage !== "entregado" && (
                      <button className="btn btn-primary" onClick={function(){ advanceDelivery(o.id); }}>
                        {stage === "preparando" ? "Marcar en camino" : "Marcar entregado"}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )
      )}

      {modalOpen && (
        <CustomerModal editing={editingCustomer} onClose={function(){ setModalOpen(false); }} onSave={handleSave} />
      )}

      {historyCustomer && (function(){
        var pastOrders = orders
          .filter(function(o){ return o.status === "pagada" && (o.customerName || "").toLowerCase() === historyCustomer.name.toLowerCase(); })
          .slice()
          .sort(function(a,b){ return new Date(b.paidAt || b.createdAt) - new Date(a.paidAt || a.createdAt); });
        var totalSpent = pastOrders.reduce(function(s,o){ return s + orderTotal(o); }, 0);
        var avgTicket = pastOrders.length ? totalSpent / pastOrders.length : 0;
        return (
          <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) setHistoryCustomer(null); }}>
            <div className="modal">
              <h3>Historial de {historyCustomer.name}</h3>
              <div className="stat-grid" style={{marginBottom:16}}>
                <div className="stat-card">
                  <div className="stat-label">Pedidos</div>
                  <div className="stat-value">{pastOrders.length}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Total gastado</div>
                  <div className="stat-value accent">{money(totalSpent)}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Ticket promedio</div>
                  <div className="stat-value">{money(avgTicket)}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Puntos actuales</div>
                  <div className="stat-value">{historyCustomer.points || 0}</div>
                </div>
              </div>

              {pastOrders.length === 0 ? (
                <div className="empty-panel">Todavía no tiene pedidos pagados registrados.</div>
              ) : (
                <div className="sales-table" style={{maxHeight:360, overflowY:"auto"}}>
                  <div className="sales-table-head" style={{gridTemplateColumns:"120px 1fr 100px"}}>
                    <div>Fecha / hora</div>
                    <div>Platillos</div>
                    <div style={{textAlign:"right"}}>Total</div>
                  </div>
                  {pastOrders.map(function(o){
                    var when = o.paidAt || o.createdAt;
                    return (
                      <div className="sales-row" style={{gridTemplateColumns:"120px 1fr 100px", cursor:"default"}} key={o.id}>
                        <div className="sales-time">
                          {new Date(when).toLocaleDateString("es-MX", { day:"2-digit", month:"short" })}
                          {" · "}{entryTimeLabel(when)}
                        </div>
                        <div className="sales-label-col">
                          <div className="sales-sub">{o.items.map(function(it){ return it.qty + "x " + it.name; }).join(", ")}</div>
                        </div>
                        <div className="sales-total">{money(orderTotal(o))}</div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="modal-actions">
                <button className="btn btn-ghost" onClick={function(){ setHistoryCustomer(null); }}>Cerrar</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

    var next = Object.assign({}, form);

function ConfiguracionModule(props){
  var settings = props.settings;
  var setSettings = props.setSettings;
  var tables = props.tables;
  var setTables = props.setTables;
  var isOnline = props.isOnline;
  var dishes = props.dishes || [];
  var categories = props.categories || [];
  var orders = props.orders || [];
  var customers = props.customers || [];
  var cortes = props.cortes || [];

  var [form, setForm] = useState(settings);
  var [tableModalOpen, setTableModalOpen] = useState(false);
  var [editingTable, setEditingTable] = useState(null);
  var [newEmpName, setNewEmpName] = useState("");
  var [newEmpPin, setNewEmpPin] = useState("");
  var [lastBackupAt, setLastBackupAt] = useState(function(){
    return loadLocal("makizen_last_backup") || null;
  });
  var [openSections, setOpenSections] = useState({
    restaurante:false, whatsapp:false, backup:false, loyalty:false, empleados:false, mesas:false, sync:false
  });

  function toggleSection(key){
    var next = Object.assign({}, openSections);
    next[key] = !next[key];
    setOpenSections(next);
  }

  function updateField(key, value){
    var next = Object.assign({}, form);
    next[key] = value;
    setForm(next);
  }

  function saveSettings(){
    setSettings(form);
  }

  function downloadBackup(){
    var backup = {
      exportedAt: new Date().toISOString(),
      dishes: dishes,
      categories: categories,
      orders: orders,
      customers: customers,
      tables: tables,
      cortes: cortes,
      settings: settings
    };
    var json = JSON.stringify(backup, null, 2);
    var blob = new Blob([json], { type: "application/json;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "makizen-roll-respaldo-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    var now = new Date().toISOString();
    saveLocal("makizen_last_backup", now);
    setLastBackupAt(now);
  }

  async function addEmployee(){
    var name = newEmpName.trim();
    var pin = newEmpPin.trim();
    if (!name || !pin){
      await appAlert("Escribe el nombre y el PIN del empleado.");
      return;
    }
    if (!/^[0-9]{3,6}$/.test(pin)){
      await appAlert("El PIN debe ser solo números (3 a 6 dígitos).");
      return;
    }
    var employees = form.employees || [];
    if (employees.some(function(e){ return e.pin === pin; })){
      await appAlert("Ya existe un empleado con ese PIN. Usa uno diferente.");
      return;
    }
    var nextEmployees = employees.concat([{ id: uid(), name: name, pin: pin }]);
    var next = Object.assign({}, form, { employees: nextEmployees });
    setForm(next);
    setSettings(next);
    setNewEmpName("");
    setNewEmpPin("");
  }

  async function removeEmployee(id){
    if (!(await appConfirm("¿Eliminar este empleado?"))) return;
    var nextEmployees = (form.employees || []).filter(function(e){ return e.id !== id; });
    var next = Object.assign({}, form, { employees: nextEmployees });
    setForm(next);
    setSettings(next);
  }

  function openNewTable(){ setEditingTable(null); setTableModalOpen(true); }
  function openEditTable(t){ setEditingTable(t); setTableModalOpen(true); }

  function handleSaveTable(t){
    var exists = tables.some(function(x){ return x.id === t.id; });
    var next = exists
      ? tables.map(function(x){ return x.id === t.id ? t : x; })
      : tables.concat([t]);
    setTables(next);
    setTableModalOpen(false);
  }

  async function handleDeleteTable(id){
    if (!(await appConfirm("¿Eliminar esta mesa?"))) return;
    setTables(tables.filter(function(x){ return x.id !== id; }));
  }

  var sortedTables = tables.slice().sort(function(a,b){ return a.number - b.number; });

  return (
    <div>
      <div className="config-section">
