function StationBoard(props){ var dishes = props.dishes || []; var dishesById = {}; dishes.forEach(function(d){ dishesById[d.id] = d; });
  var orders = props.orders;
  var setOrders = props.setOrders;
  var kiosk = !!props.kiosk;
  var station = props.station === "bar" ? "bar" : "cocina";
  var settings = props.settings || {};

  var [, setTick] = useState(0);
  var knownIdsRef = useRef(null);
  var [pinPrompt, setPinPrompt] = useState(null);

  function requestPin(actionLabel, masterPin, onSuccess){
    setPinPrompt({ actionLabel: actionLabel, masterPin: masterPin, onSuccess: onSuccess });
  }

  useEffect(function(){
    var interval = setInterval(function(){ setTick(function(t){ return t + 1; }); }, 1000);
    return function(){ clearInterval(interval); };
  }, []);

  function markReady(id){
    var target = orders.find(function(o){ return o.id === id; });
    if (!target) return;
    var next = Object.assign({}, target);
    if (station === "cocina") next.kitchenReady = true; else next.barReady = true;
    var becameReady = orderFullyReady(next, next.kitchenReady, next.barReady);
    if (becameReady){
      next.status = "listo";
      next.readyAt = new Date().toISOString();
    }

    setOrders(orders.map(function(o){ return o.id === id ? next : o; }));

    if (becameReady && next.type === "Domicilio" && next.customerPhone && settings.whatsappNotifyEnabled !== false){
      var msg = buildReadyMessage(settings.whatsappTemplate, next, settings);
      var link = whatsappLink(next.customerPhone, msg);
      if (link) window.open(link, "_blank");
    }
  }

  function cancelOrder(id){
    requestPin("Cancelar esta comanda", settings.cancelPin, function(who){
      setOrders(orders.map(function(o){ return o.id === id ? Object.assign({}, o, {status:"cancelada", cancelledBy: who, cancelledAt: new Date().toISOString()}) : o; }));
    });
  }

  var relevant = orders.filter(function(o){
    if (o.status !== "en_cocina") return false;
    if (station === "cocina") return orderHasKitchenItems(o) && !o.kitchenReady;
    return orderHasBarItems(o) && !o.barReady;
  });

  useEffect(function(){
    var currentIds = relevant.map(function(o){ return o.id; });
    if (knownIdsRef.current === null){
      knownIdsRef.current = new Set(currentIds);
      return;
    }
    var hasNew = currentIds.some(function(id){ return !knownIdsRef.current.has(id); });
    if (hasNew && settings.kitchenSoundEnabled !== false){
      playOrderChime();
    }
    knownIdsRef.current = new Set(currentIds);
  }, [orders]);

  var lateMin = Number(settings.lateOrderMinutes) > 0 ? Number(settings.lateOrderMinutes) : 20;
  var halfLate = Math.round(lateMin / 2);

  var withMins = relevant.map(function(o){ return { order:o, mins: minutesSince(o.createdAt) }; });
  withMins.sort(function(a,b){ return b.mins - a.mins; });

  var counts = { verde:0, amarillo:0, rojo:0 };
  withMins.forEach(function(x){ counts[kdsLevel(x.mins, lateMin)]++; });

  var itemFilter = station === "cocina" ? isKitchenItem : isBarItem;
  var readyLabel = station === "cocina" ? "✓ Listo · salió de cocina" : "✓ Listo · salió de barra";
  var emptyTitle = station === "cocina" ? "No hay comandas en cocina" : "No hay comandas de bebidas en el bar";

  return (
    <div className={kiosk ? "kds-view kiosk" : "kds-view"}>
      <div className="kds-legend">
        <div className="kds-legend-item">
          <span className="kds-dot verde"></span> Verde · menos de {halfLate} min ({counts.verde})
        </div>
        <div className="kds-legend-item">
          <span className="kds-dot amarillo"></span> Amarillo · {halfLate} a {lateMin} min ({counts.amarillo})
        </div>
        <div className="kds-legend-item">
          <span className="kds-dot rojo"></span> Rojo · más de {lateMin} min ({counts.rojo})
        </div>
      </div>

      {withMins.length === 0 ? (
        <div className="empty-panel">
          <p style={{fontWeight:600}}>{emptyTitle}</p>
          <p style={{fontSize:12.5, marginTop:4}}>Las comandas enviadas desde "Comandas" aparecerán aquí en tiempo real.</p>
        </div>
      ) : (
        <div className="kds-grid">
          {withMins.map(function(x){
            var order = x.order;
            var level = kdsLevel(x.mins, lateMin);
            var items = order.items.filter(itemFilter);
            return (
              <div key={order.id} className={"kds-card level-" + level}>
                <div className="kds-card-top">
                  <div>
                    <div className="order-type-tag">{order.type}</div>
                    <div className="order-label">{orderDisplayLabel(order)}</div>
                  </div>
                  <span className={"kds-level-badge " + level}>{KDS_LEVEL_LABEL[level]}</span>
                </div>

                <div className="kds-time-row">
                  <div className="kds-time-block">
                    <div className="kds-time-label">Entró</div>
                    <div className="kds-time-value">{entryTimeLabel(order.createdAt)}</div>
                  </div>
                  <div className="kds-time-block">
                    <div className="kds-time-label">Lleva</div>
                    <div className={"kds-elapsed " + level}>{elapsedLabel(x.mins)}</div>
                  </div>
                </div>

                <div className="order-items-preview">
                  {items.map(function(it, i){
                    return (
                      <div key={i}>
                        {it.qty} × {it.name}{it.modifiers.length > 0 ? " (" + it.modifiers.map(function(m){ return m.name; }).join(", ") + ")" : ""}
                        {(function(){ var d = dishesById[it.dishId]; return d && d.category && d.category.toLowerCase().indexOf("charola") !== -1 && d.description ? (<div className="kds-item-note">🍱 {d.description}</div>) : null; })()}
                        {it.note && <div className="kds-item-note">📝 {it.note}</div>}
                      </div>
                    );
                  })}
                </div>

                <div className="order-card-actions">
                  <button className="btn btn-primary" onClick={function(){ markReady(order.id); }}>{readyLabel}</button>
                  <button className="btn btn-danger-ghost" onClick={function(){ cancelOrder(order.id); }}>Cancelar</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {pinPrompt && (
        <PinPromptModal
          actionLabel={pinPrompt.actionLabel}
          settings={settings}
          masterPin={pinPrompt.masterPin}
          onConfirm={function(name){ var fn = pinPrompt.onSuccess; setPinPrompt(null); fn(name); }}
          onClose={function(){ setPinPrompt(null); }}
        />
      )}
    </div>
  );
}

function StationKiosk(props){ var dishes = props.dishes;
  var orders = props.orders;
  var setOrders = props.setOrders;
  var settings = props.settings;
  var station = props.station === "bar" ? "bar" : "cocina";
  var [clock, setClock] = useState(new Date());
  var fullscreenState = useFullscreen();
  var isFullscreen = fullscreenState[0], toggleFullscreen = fullscreenState[1];

  useEffect(function(){
    var interval = setInterval(function(){ setClock(new Date()); }, 1000);
    return function(){ clearInterval(interval); };
  }, []);

  var clockLabel = clock.toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  var subLabel = station === "bar" ? "Bar · Comandas de bebidas" : "Cocina · KDS";

  return (

      <div className="kiosk-header">

          <RollMark size={40}/>
          <div>

        </div>
        <div style={{display:"flex", alignItems:"center", gap:14}}>
          <button className="kiosk-fullscreen-btn" onClick={toggleFullscreen}>
            {isFullscreen ? "⤡ Salir" : "⤢ Pantalla completa"}
          </button>
          <div className="kiosk-clock">{clockLabel}</div>
        </div>
      </div>
      <div className="kiosk-content">
        {station === "bar" ? (
          <BarModule orders={orders} setOrders={setOrders} settings={settings} kiosk={true} dishes={dishes} />
        ) : (
          <KDSModule orders={orders} setOrders={setOrders} settings={settings} kiosk={true} dishes={dishes} />
        )}
      </div>
    </div>
  );
}

function AppInner(){
  var isOnline = useOnlineStatus();
  var fullscreenState = useFullscreen();
  var isFullscreen = fullscreenState[0], toggleFullscreen = fullscreenState[1];

  var dishesTriplet = useSyncedCollection("dishes", seedDishes);
  var dishesRaw = dishesTriplet[0], setDishes = dishesTriplet[1]; var dishes = useMemo(function(){ return dishesRaw.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); }); }, [dishesRaw]);

  var categoriesTriplet = useSyncedCollection("categories", seedCategories);
  var categories = categoriesTriplet[0], setCategories = categoriesTriplet[1];

  var ordersTriplet = useSyncedCollection("orders", function(){ return []; });
  var orders = ordersTriplet[0], setOrders = ordersTriplet[1];

  var tablesTriplet = useSyncedCollection("tables", seedTables);
  var tables = tablesTriplet[0], setTables = tablesTriplet[1];

  var inventoryTriplet = useSyncedCollection("inventory", seedInventory);
  var inventory = inventoryTriplet[0], setInventory = inventoryTriplet[1];

  var customersTriplet = useSyncedCollection("customers", seedCustomers);
  var customers = customersTriplet[0], setCustomers = customersTriplet[1];

  var settingsTriplet = useSyncedCollection("settings", seedSettings);
  var settingsList = settingsTriplet[0], setSettingsList = settingsTriplet[1];
  var settings = settingsList[0] || seedSettings()[0];
  function setSettings(next){ setSettingsList([next]); }

  var cortesTriplet = useSyncedCollection("cortes", function(){ return []; });
  var cortes = cortesTriplet[0], setCortes = cortesTriplet[1];

  var [view, setView] = useState("dashboard");
  var [cajaFocusId, setCajaFocusId] = useState(null);
  var [configUnlocked, setConfigUnlocked] = useState(false);
  var [currentEmployeeId, setCurrentEmployeeId] = useState(function(){
    return loadLocal("makizen_current_employee") || null;
  });
  var [pinTarget, setPinTarget] = useState(null);
  var [pinInput, setPinInput] = useState("");
  var [pinError, setPinError] = useState("");
  var [configPinPrompt, setConfigPinPrompt] = useState(false);

  function goToView(key){
    if (key === "config" && !configUnlocked){
      setConfigPinPrompt(true);
      return;
    }
    if (key !== "config"){
      setConfigUnlocked(false);
    }
    setView(key);
  }

  function goToCaja(orderId){
    setCajaFocusId(orderId);
    goToView("caja");
  }

  var kioskStation = (function(){
    try{
      var params = new URLSearchParams(window.location.search);
      var modo = params.get("modo");
      if (modo === "cocina" || modo === "bar") return modo;
      return null;
    }catch(e){ return null; }
  })();

  if (kioskStation){
    return <StationKiosk orders={orders} setOrders={setOrders} settings={settings} station={kioskStation} dishes={dishes} />;
  }

  var employeesList = settings.employees || [];
  var currentEmployee = currentEmployeeId === "admin"
    ? { id:"admin", name:"Administrador" }
    : (employeesList.find(function(e){ return e.id === currentEmployeeId; }) || null);

  function selectEmployee(emp){
    setPinTarget(emp);
    setPinInput("");
    setPinError("");
  }

  function enterAsAdmin(){
    setPinTarget({ id:"admin", name:"Administrador", pin: settings.configPin || "9072" });
    setPinInput("");
    setPinError("");
  }

  function submitPin(){
    if (pinInput.trim() !== pinTarget.pin){
      setPinError("PIN incorrecto. Intenta de nuevo.");
      setPinInput("");
      return;
    }
    setCurrentEmployeeId(pinTarget.id);
    saveLocal("makizen_current_employee", pinTarget.id);
    setPinTarget(null);
    setPinInput("");
    setPinError("");
  }

  async function endShift(){
    if (!(await appConfirm("¿Cerrar tu turno? La próxima persona que use esta tablet deberá elegir su nombre."))) return;
    setCurrentEmployeeId(null);
    saveLocal("makizen_current_employee", null);
  }

  if (pinTarget){
    return (
      <div className="shift-gate">
        <RollMark size={56}/>
        <h2 className="shift-gate-title">Hola, {pinTarget.name}</h2>
        <p className="shift-gate-sub">Ingresa tu PIN para entrar.</p>
        <form
          className="shift-gate-list"
          onSubmit={function(e){ e.preventDefault(); submitPin(); }}
        >
          <input
            type="password"
            inputMode="numeric"
            autoFocus
            className="shift-gate-pin-input"
            value={pinInput}
            onChange={function(e){ setPinInput(e.target.value); setPinError(""); }}
            placeholder="PIN"
          />
          {pinError && <p className="shift-gate-error">{pinError}</p>}
          <button type="submit" className="shift-gate-btn shift-gate-btn-primary">Entrar</button>
          <button
            type="button"
            className="shift-gate-admin-link"
            onClick={function(){ setPinTarget(null); setPinInput(""); setPinError(""); }}
          >
            ← Volver
          </button>
        </form>
      </div>
    );
  }

  if (employeesList.length > 0 && !currentEmployee){
    return (
      <div className="shift-gate">
        <RollMark size={56}/>
        <h2 className="shift-gate-title">¿Quién eres?</h2>
        <p className="shift-gate-sub">Elige tu nombre para iniciar tu turno en esta tablet.</p>
        <div className="shift-gate-list">
          {employeesList.map(function(e){
            return (
              <button key={e.id} className="shift-gate-btn" onClick={function(){ selectEmployee(e); }}>
                {e.name}
              </button>
            );
          })}
        </div>
        <button className="shift-gate-admin-link" onClick={enterAsAdmin}>Entrar como administrador</button>
      </div>
    );
  }

  var titles = {
    dashboard: { title:"Panel general", sub:"Resumen de Makizen Roll" },
    menu: { title:"Menú", sub:"Catálogo de platillos, precios y modificadores" },
    mesas: { title:"Mesas", sub:"Plano del salón en vivo" },
    pos: { title:"Comandas", sub:"Toma pedidos y envíalos a cocina" },
    caja: { title:"Caja", sub:"Cobros y corte del día" },
    cocina: { title:"Cocina (KDS)", sub:"Tiempo de espera de cada comanda desde su entrada" },
    bar: { title:"Bar", sub:"Bebidas por preparar, separadas de cocina" },
    inventario: { title:"Inventario", sub:"Insumos, existencias y alertas de reabasto" },
    reportes: { title:"Reportes", sub:"Ventas, platillos top y métodos de pago" },
    clientes: { title:"Clientes / Delivery", sub:"Directorio de clientes y domicilios en curso" },
    config: { title:"Configuración", sub:"Datos del restaurante, mesas y sincronización" }
  };
  var current = titles[view] || titles.dashboard;

  return (
    <div className="app-shell">
      <Sidebar view={view} setView={goToView} />
      <div className="main">
        <div className="topbar">
          <div>
            <h1 className="page-title">{current.title}</h1>
            <div className="page-sub">{current.sub}</div>
          </div>
          <div className="topbar-right">
            {currentEmployee && (
              <div className="shift-badge">
                👤 {currentEmployee.name}
                <button onClick={endShift}>Cambiar</button>
              </div>
            )}
            <button className="fullscreen-btn" onClick={toggleFullscreen}>
              {isFullscreen ? "⤡ Salir de pantalla completa" : "⤢ Pantalla completa"}
            </button>
            <div className={"sync-badge" + (!SYNC_ENABLED ? " off" : (isOnline ? " on" : " offline"))}>
              {!SYNC_ENABLED ? "💻 Modo local" : (isOnline ? "☁ Sincronizado" : "📴 Sin conexión · guardando local")}
            </div>
          </div>
        </div>
        <div className="content">
          {view === "dashboard" && <Dashboard dishes={dishes} orders={orders} />}
          {view === "menu" && <MenuModule dishes={dishes} setDishes={setDishes} categories={categories} setCategories={setCategories} />}
          {view === "mesas" && <MesasModule dishes={dishes} orders={orders} setOrders={setOrders} tables={tables} onCobrar={goToCaja} categories={categories} settings={settings} currentEmployeeName={currentEmployee ? currentEmployee.name : ""} />}
          {view === "pos" && <ComandasModule dishes={dishes} orders={orders} setOrders={setOrders} customers={customers} setCustomers={setCustomers} categories={categories} tables={tables} settings={settings} currentEmployeeName={currentEmployee ? currentEmployee.name : ""} />}
          {view === "caja" && <CajaModule orders={orders} setOrders={setOrders} focusOrderId={cajaFocusId} clearFocus={function(){ setCajaFocusId(null); }} settings={settings} cortes={cortes} setCortes={setCortes} customers={customers} setCustomers={setCustomers} currentEmployeeName={currentEmployee ? currentEmployee.name : ""} />}
          {view === "cocina" && <KDSModule orders={orders} setOrders={setOrders} settings={settings} dishes={dishes} />}
          {view === "bar" && <BarModule orders={orders} setOrders={setOrders} settings={settings} dishes={dishes} />}
          {view === "inventario" && <InventarioModule inventory={inventory} setInventory={setInventory} />}
          {view === "reportes" && <ReportesModule orders={orders} dishes={dishes} setOrders={setOrders} settings={settings} cortes={cortes} />}
          {view === "clientes" && <ClientesModule customers={customers} setCustomers={setCustomers} orders={orders} setOrders={setOrders} />}
          {view === "config" && <ConfiguracionModule settings={settings} setSettings={setSettings} tables={tables} setTables={setTables} isOnline={isOnline} dishes={dishes} categories={categories} orders={orders} customers={customers} cortes={cortes} />}
        </div>
      </div>

      {configPinPrompt && (
        <PinPromptModal
          actionLabel="Entrar a Configuración"
          settings={settings}
          masterPin={settings.configPin || "9072"}
          onConfirm={function(){ setConfigUnlocked(true); setConfigPinPrompt(false); setView("config"); }}
          onClose={function(){ setConfigPinPrompt(false); }}
        />
      )}
    </div>
  );
}

function App(){
  var updateAvailable = useAppUpdateChecker();

  useEffect(function(){
    function tryFullscreenOnce(){
      if (!currentFullscreenElement()){
        requestFullscreenOn(document.documentElement);
      }
      getAudioContext();
      document.removeEventListener("click", tryFullscreenOnce);
      document.removeEventListener("touchend", tryFullscreenOnce);
    }
    document.addEventListener("click", tryFullscreenOnce);
    document.addEventListener("touchend", tryFullscreenOnce);
    return function(){
      document.removeEventListener("click", tryFullscreenOnce);
      document.removeEventListener("touchend", tryFullscreenOnce);
    };
  }, []);

  return (
    <React.Fragment>
      <AppInner />
      <AppDialogHost />
      {updateAvailable && (
        <div style={{
          position:"fixed", bottom:18, left:"50%", transform:"translateX(-50%)",
          background:"#14100C", color:"#fff", padding:"12px 14px 12px 18px",
          borderRadius:999, display:"flex", gap:14, alignItems:"center",
          zIndex:99999, boxShadow:"0 10px 30px #00000050", fontSize:13
        }}>
          <span>🔄 Hay una versión nueva del sistema</span>
          <button
            type="button"
            onClick={function(){ window.location.reload(); }}
            style={{background:"#fff", color:"#14100C", border:"none", borderRadius:999, padding:"7px 16px", fontWeight:700, cursor:"pointer", fontSize:13}}
          >
            Actualizar ahora
          </button>
        </div>
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
