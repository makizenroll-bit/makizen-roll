<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Makizen Roll · Sistema de Gestión</title>

<!-- PWA: hace que Chrome pueda "instalar" esto como app, con ícono y sin
     barra de navegador. Requiere subir manifest.json, sw.js, icon-192.png
     e icon-512.png junto a este HTML. -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#14100C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Makizen Roll" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
  // Registra el service worker (necesario para que Chrome ofrezca "Instalar app").
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        console.warn("No se pudo registrar el service worker:", e);
      });
    });
  }
</script>
<style>
  :root{
    --ai-900:#0B1B26;
    --ai-800:#102431;
    --ai-700-solid:#173243;
    --rice-050:#FBF8F1;
    --rice-100:#F5EFE0;
    --rice-200:#EBE1C8;
    --wasabi-500:#7C9A3D;
    --wasabi-600:#658030;
    --uni-500:#E3572A;
    --umeboshi-500:#C1443A;
    --ink-900:#14100C;
    --ink-600:#4A4238;
    --gold-line:#C9A85C;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ai-900);
    color:var(--rice-100);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}

  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:248px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--ai-800) 0%, var(--ai-900) 100%);
    border-right:1px solid #FFFFFF14;
    display:flex;
    flex-direction:column;
    padding:24px 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:4px 8px 20px 8px;
    border-bottom:1px solid #FFFFFF14;
    margin-bottom:18px;
  }
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    line-height:1.15;
    color:var(--rice-050);
    letter-spacing:0.2px;
  }
  .brand-sub{
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-line);
    margin-top:2px;
  }
  .nav-group-label{
    font-size:10px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:#8FA3AE;
    margin:16px 10px 8px 10px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:8px;
    color:#C9D6DC;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    user-select:none;
  }
  .nav-item:hover{background:#FFFFFF0D;color:var(--rice-050);}
  .nav-item.active{
    background:var(--wasabi-500);
    color:#0B1B26;
    font-weight:600;
  }
  .nav-item.disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  .nav-badge{
    margin-left:auto;
    font-size:9px;
    padding:2px 6px;
    border-radius:20px;
    background:#FFFFFF1A;
    color:#9BB0BA;
    letter-spacing:0.4px;
  }

  .main{
    flex:1;
    min-width:0;
    background:var(--rice-050);
    color:var(--ink-900);
    border-radius:20px 0 0 20px;
    margin:10px 10px 10px 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 32px 16px 32px;
    border-bottom:1px solid #14100C14;
  }
  .page-title{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    margin:0;
  }
  .page-sub{
    font-size:12.5px;
    color:var(--ink-600);
    margin-top:3px;
  }
  .content{
    padding:24px 32px 40px 32px;
    overflow-y:auto;
    flex:1;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .stat-card{
    background:#fff;
    border:1px solid #14100C10;
    border-radius:14px;
    padding:18px 18px;
  }
  .stat-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--ink-600);
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:26px;
    font-weight:600;
    margin-top:6px;
  }
  .stat-value.accent{color:var(--wasabi-600);}
  .empty-panel{
    background:#fff;
    border:1px dashed #14100C22;
    border-radius:14px;
    padding:36px;
    text-align:center;
    color:var(--ink-600);
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .search-input{
    flex:1;
    min-width:200px;
    padding:9px 14px;
    border-radius:9px;
    border:1px solid #14100C22;
    font-family:var(--font-body);
    font-size:13.5px;
    background:#fff;
  }
  .search-input:focus{outline:2px solid var(--wasabi-500);outline-offset:1px;}
  .btn{
    border:none;
    border-radius:9px;
    padding:9px 16px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--wasabi-500);color:#0B1B26;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--ink-900);border:1px solid #14100C22;}
  .btn-ghost:hover{background:#14100C08;}
  .btn-danger-ghost{background:transparent;color:var(--umeboshi-500);border:1px solid #C1443A44;}
  .btn-danger-ghost:hover{background:#C1443A10;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn:disabled:hover{filter:none;}

  .cat-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .cat-tab{
    padding:7px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    background:#fff;
    border:1px solid #14100C1A;
    color:var(--ink-600);
    user-select:none;
  }
  .cat-tab:hover{border-color:var(--wasabi-500);}
  .cat-tab.active{
    background:var(--ai-700-solid);
    color:var(--rice-050);
    border-color:var(--ai-700-solid);
  }
  .cat-tab-add{
    background:transparent;
    border:1px dashed #14100C33;
    color:var(--ink-600);
    font-weight:700;
  }
  .cat-tab-add:hover{border-color:var(--wasabi-500);color:var(--wasabi-600);}
  .cat-tab-remove{
    display:inline-block;
    margin-left:6px;
    font-weight:700;
    color:inherit;
    opacity:0.5;
  }
  .cat-tab-remove:hover{opacity:1;color:var(--umeboshi-500);}
  .cat-tab[draggable="true"]{cursor:grab;}
  .cat-tab.cat-dragging{opacity:0.35;}
  .cat-tab.cat-drag-over{outline:2px dashed var(--wasabi-500);outline-offset:2px;}

  .dish-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .dish-card{
    background:#fff;
    border:1px solid #14100C10;
    border-radius:14px;
    padding:16px 16px 14px 16px;
    position:relative;
    transition:box-shadow .15s ease;
  }
  .dish-card:hover{box-shadow:0 4px 18px #14100C14;}
  .dish-card.inactive{opacity:0.5;}
  .dish-card[draggable="true"]{cursor:grab;}
  .dish-card.dragging{opacity:0.35;box-shadow:none;}
  .dish-card.drag-over{outline:2px dashed var(--wasabi-500);outline-offset:2px;}
  .dish-drag-handle{
    position:absolute;
    top:14px;
    right:14px;
    font-size:13px;
    color:#14100C33;
    letter-spacing:1px;
    line-height:1;
    cursor:grab;
    user-select:none;
  }
  .dish-drag-handle:hover{color:var(--ink-600);}
  .drag-order-note{
    font-size:11.5px;
    color:var(--ink-600);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dish-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-right:16px;}
  .dish-name{font-weight:700;font-size:14.5px;line-height:1.3;}
  .dish-cat-tag{
    display:inline-block;
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--wasabi-600);
    font-weight:700;
    margin-bottom:4px;
  }
  .dish-price{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:15.5px;
    color:var(--ink-900);
    white-space:nowrap;
  }
  .station-chip{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    margin-top:6px;
  }
  .station-chip.cocina{background:#E3572A1E;color:var(--uni-500);}
  .station-chip.bar{background:#7C9A3D22;color:var(--wasabi-600);}
  .dish-desc{
    font-size:12.5px;
    color:var(--ink-600);
    margin-top:6px;
    line-height:1.45;
    min-height:18px;
  }
  .dish-mods{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .mod-chip{
    font-size:10.5px;
    background:var(--rice-200);
    color:var(--ink-600);
    padding:3px 8px;
    border-radius:20px;
    font-family:var(--font-mono);
  }
  .dish-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
    border-top:1px solid #14100C0F;
    padding-top:10px;
  }
  .icon-btn{
    background:none;
    border:none;
    font-size:12px;
    cursor:pointer;
    color:var(--ink-600);
    padding:4px 8px;
    border-radius:6px;
  }
  .icon-btn:hover{background:#14100C0C;color:var(--ink-900);}
  .toggle-pill{
    margin-left:auto;
    font-size:10px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
  }
  .toggle-pill.on{background:#7C9A3D22;color:var(--wasabi-600);}
  .toggle-pill.off{background:#C1443A1A;color:var(--umeboshi-500);}

  .modal-backdrop{
    position:fixed;inset:0;
    background:#0B1B26AA;
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:#fff;
    border-radius:16px;
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    padding:26px 26px 22px 26px;
  }
  .modal h3{
    font-family:var(--font-display);
    font-size:20px;
    margin:0 0 18px 0;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink-600);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid #14100C26;
    font-family:var(--font-body);
    font-size:13.5px;
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .mods-editor{
    border:1px solid #14100C1A;
    border-radius:10px;
    padding:10px;
  }
  .mod-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .mod-row input{flex:1;padding:7px 10px;font-size:12.5px;}
  .mod-row input.price{max-width:90px;flex:none;}
  .mod-remove{
    background:none;border:none;color:var(--umeboshi-500);
    cursor:pointer;font-size:14px;padding:2px 6px;
  }
  .add-mod-btn{
    font-size:12px;font-weight:600;color:var(--wasabi-600);
    background:none;border:none;cursor:pointer;padding:4px 0;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid #14100C12;
  }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#14100C22;border-radius:20px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Comandas / POS ---------- */
  .orders-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:14px;
  }
  .order-card{
    background:#fff;
    border:1px solid #14100C10;
    border-radius:14px;
    padding:16px;
    border-left:4px solid var(--wasabi-500);
  }
  .order-card.status-listo{border-left-color:#E0A72E;}
  .order-card.status-pagada{border-left-color:#8FA3AE; opacity:0.6;}
  .order-card.status-cancelada{border-left-color:var(--umeboshi-500); opacity:0.55;}
  .order-card-late{
    border-left-color:var(--umeboshi-500);
    box-shadow:0 0 0 1px #C1443A33;
    animation:lateGlow 1.6s ease-in-out infinite;
  }
  @keyframes lateGlow{
    0%, 100%{box-shadow:0 0 0 1px #C1443A22;}
    50%{box-shadow:0 0 0 3px #C1443A44;}
  }
  .order-status-badge.late{background:#C1443A22;color:var(--umeboshi-500);}
  .order-top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .order-type-tag{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--wasabi-600);
  }
  .order-label{font-family:var(--font-display);font-size:17px;font-weight:600;margin-top:2px;}
  .order-meta{font-size:11.5px;color:var(--ink-600);margin-top:2px;}
  .order-status-badge{
    font-size:9.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  .order-status-badge.en-cocina{background:#E3572A22;color:var(--uni-500);}
  .order-status-badge.listo{background:#E0A72E26;color:#8A6414;}
  .order-status-badge.pagada{background:#7C9A3D22;color:var(--wasabi-600);}
  .order-status-badge.cancelada{background:#C1443A1A;color:var(--umeboshi-500);}
  .order-items-preview{
    margin-top:10px;
    font-size:12px;
    color:var(--ink-600);
    line-height:1.5;
  }
  .order-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #14100C0F;
  }
  .order-total{font-family:var(--font-mono);font-weight:700;font-size:16px;}
  .order-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  .pos-layout{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:20px;
    align-items:start;
  }
  .pos-picker{min-width:0;}
  .top-dishes-row{margin-bottom:10px;}
  .top-dishes-label{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-600);
    margin-bottom:6px;
  }
  .top-dishes-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .top-dish-chip{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:20px;
    background:#E0A72E1E;
    border:1px solid #E0A72E44;
    color:#8A6414;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .top-dish-chip:hover{background:#E0A72E33;}
  .loyalty-box{
    background:#7C9A3D14;
    border:1px solid #7C9A3D33;
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    margin-bottom:14px;
  }
  .shift-gate{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:32px;
    background:var(--rice-050);
    text-align:center;
  }
  .shift-gate-title{
    font-family:var(--font-display);
    font-size:26px;
    margin:16px 0 0 0;
  }
  .shift-gate-sub{
    font-size:13.5px;
    color:var(--ink-600);
    margin:0 0 20px 0;
  }
  .shift-gate-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:320px;
  }
  .shift-gate-btn{
    padding:16px;
    border-radius:12px;
    border:1px solid #14100C22;
    background:#fff;
    font-size:15px;
    font-weight:700;
    color:var(--ink-900);
    cursor:pointer;
  }
  .shift-gate-btn:hover{background:#14100C08;}
  .shift-gate-btn-primary{
    background:var(--ink-900);
    color:#fff;
    border-color:var(--ink-900);
    text-align:center;
  }
  .shift-gate-btn-primary:hover{background:#14100Cdd;}
  .shift-gate-pin-input{
    padding:16px;
    border-radius:12px;
    border:1px solid #14100C33;
    background:#fff;
    font-size:22px;
    letter-spacing:6px;
    text-align:center;
    font-family:var(--font-mono);
  }
  .shift-gate-error{
    color:var(--umeboshi-500);
    font-size:12.5px;
    font-weight:600;
    text-align:center;
    margin:-2px 0 0 0;
  }
  .shift-gate-admin-link{
    margin-top:22px;
    background:none;
    border:none;
    color:var(--ink-600);
    font-size:12.5px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
  }
  .shift-badge{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid #14100C22;
    background:#fff;
    font-size:12px;
    font-weight:600;
  }
  .shift-badge button{
    background:none;
    border:none;
    color:var(--umeboshi-500);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    padding:0;
  }
  .pos-dish-btn{
    background:#fff;
    border:1px solid #14100C12;
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .pos-dish-btn:hover{border-color:var(--wasabi-500);box-shadow:0 3px 12px #14100C10;}
  .pos-dish-name{font-weight:700;font-size:13.5px;}
  .pos-dish-price{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-600);margin-top:3px;}

  .pos-cart{
    background:#fff;
    border:1px solid #14100C12;
    border-radius:14px;
    padding:18px;
    position:sticky;
    top:0;
  }
  .pos-cart h3{

/* ---------------------------------------------------------
   Sincronización entre dispositivos (Firestore) — modo dual
   ---------------------------------------------------------
   Para activar la sincronización real entre caja, cocina y
   meseros: crea un proyecto gratis en https://console.firebase.google.com,
   activa "Firestore Database" (modo producción, reglas abiertas para
   pruebas) y pega aquí los datos de tu proyecto (Configuración del
   proyecto → tus apps → SDK de Firebase).
   Mientras esto diga "TU_API_KEY", el sistema funciona 100% local
   (cada dispositivo guarda sus propios datos, sin sincronía, y no
   necesita internet para nada más que la primera carga).
   Una vez configurado, el sistema queda en modo DUAL: sincroniza en
   tiempo real cuando hay internet, y si se cae la conexión sigue
   funcionando normal con una copia local, sincronizando solo lo
   pendiente en cuanto vuelve la señal. */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyC4suSwXcg7WsLuZWeMRgMllQ20haVLKuQ",
  authDomain: "makizen-roll.firebaseapp.com",
  projectId: "makizen-roll",
  storageBucket: "makizen-roll.firebasestorage.app",
  messagingSenderId: "298876683393",
  appId: "1:298876683393:web:ecb6a9335485b1d186b980"
};

var SYNC_ENABLED = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "TU_API_KEY";
var db = null;
if (SYNC_ENABLED){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);

    // App Check: firma cada solicitud a Firestore para probar que viene de
    // esta app real (y no de alguien copiando el código/las llaves).
    // La "clave del sitio" de reCAPTCHA v3 no es secreta, es normal que
    // esté aquí en el código — la protección real la da la clave SECRETA,
    // que solo vive dentro de la consola de Firebase, nunca en este archivo.
    firebase.appCheck().activate(
      "6Ld7pHctAAAAAP4GxWYVNFkB_kgm7KFD5BdS1Myo",
      true // refresca el token automáticamente
    );

    db = firebase.firestore();
    // Modo dual: guarda una copia local de la base de datos en el propio
    // dispositivo. Si se cae el internet o el wifi, la caja/cocina/bar
    // siguen funcionando normal contra esa copia local, y en cuanto vuelve
    // la conexión, Firestore sincroniza solo los cambios pendientes.
    db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
      console.warn("Persistencia offline no disponible en este navegador/pestaña:", err.code);
    });
  }catch(e){
    console.error("No se pudo inicializar Firebase:", e);
    SYNC_ENABLED = false;
  }
}

      mismo valor que APP_VERSION de abajo, ej: {"version":"2026-08-05-1"}
   3. Reemplaza APP_UPDATE_URL con la URL real de tu version.json
      (Settings → Pages te da el dominio, ej. https://tuusuario.github.io/makizen-roll/version.json).
   4. En las tablets, abre la URL de GitHub Pages (no el archivo local) y
      usa "Agregar a pantalla de inicio" — así siempre carga la versión
      publicada, no una copia vieja guardada en el dispositivo.
   Mientras APP_UPDATE_URL esté vacío, este chequeo simplemente no hace nada
   (no rompe el modo local ni el modo Firebase). */
var APP_VERSION = "2026-08-11-2";
var APP_UPDATE_URL = "https://makizenroll-bit.github.io/makizen-roll/version.json";

function useAppUpdateChecker(){
  var [updateAvailable, setUpdateAvailable] = useState(false);

  useEffect(function(){
    if (!APP_UPDATE_URL) return;

    function check(){
      fetch(APP_UPDATE_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (data && data.version && data.version !== APP_VERSION){
            setUpdateAvailable(true);
          }
        })
        .catch(function(){ /* sin internet o repo no configurado: se ignora, se reintenta después */ });
    }

    check();
    var interval = setInterval(check, 5 * 60 * 1000); // revisa cada 5 minutos
    document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });
    return function(){ clearInterval(interval); };
  }, []);

  return updateAvailable;
}

function useOnlineStatus(){
  var [online, setOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine : true);
  useEffect(function(){
    function goOnline(){ setOnline(true); }
    function goOffline(){ setOnline(false); }
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return function(){
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);
  return online;
}

function currentFullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}

var sharedAudioCtx = null;
function getAudioContext(){
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!sharedAudioCtx){
    try{ sharedAudioCtx = new Ctx(); }catch(e){ return null; }
  }
  if (sharedAudioCtx.state === "suspended"){
    sharedAudioCtx.resume().catch(function(){});
  }
  return sharedAudioCtx;
}

function playTone(ctx, freq, startAt, duration){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(0.35, startAt + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startAt);
  osc.stop(startAt + duration + 0.02);
}

function playOrderChime(){
  var ctx = getAudioContext();
  if (!ctx) return;
  try{
    var now = ctx.currentTime;
    playTone(ctx, 880, now, 0.16);
    playTone(ctx, 1180, now + 0.18, 0.22);
  }catch(e){}
}

function requestFullscreenOn(el){
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) fn.call(el);
}

function exitFullscreenNow(){
  var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (fn) fn.call(document);
}

function useFullscreen(){
  var [isFullscreen, setIsFullscreen] = useState(!!currentFullscreenElement());

  useEffect(function(){
    function onChange(){ setIsFullscreen(!!currentFullscreenElement()); }
    document.addEventListener("fullscreenchange", onChange);
    document.addEventListener("webkitfullscreenchange", onChange);
    document.addEventListener("msfullscreenchange", onChange);
    return function(){
      document.removeEventListener("fullscreenchange", onChange);
      document.removeEventListener("webkitfullscreenchange", onChange);
      document.removeEventListener("msfullscreenchange", onChange);
    };
  }, []);

  function toggleFullscreen(){
    if (currentFullscreenElement()){
      exitFullscreenNow();
    } else {
      requestFullscreenOn(document.documentElement);
    }
  }

  return [isFullscreen, toggleFullscreen];
}

    if (raw) return JSON.parse(raw);

function saveLocal(key, value){

// Hook genérico: mantiene una colección (dishes/orders/tables) sincronizada
// con Firestore en tiempo real cuando SYNC_ENABLED está activo; si no,
// usa localStorage como almacenamiento del dispositivo.
//
// Antes, cada guardado sobrescribía TODO el arreglo en la nube. Si dos tablets
// guardaban casi al mismo tiempo (ej. cocina marca "listo" mientras caja cobra
// otra comanda), la que terminaba de escribir al último borraba por completo
// los cambios de la otra. Ahora, para colecciones con "id" por registro
// (comandas, platillos, mesas, clientes, inventario, cortes), el guardado
// combina los cambios de este dispositivo con lo último que haya en la nube
// en vez de reemplazar todo el arreglo — así, cambios a REGISTROS DISTINTOS
// hechos casi al mismo tiempo en tablets distintas ya no se pisan entre sí.
// (Si dos tablets editan el MISMO registro casi al mismo tiempo, sigue ganando
// el que termine de guardar último — eso no cambia.)
function useSyncedCollection(key, seedFn){
  var local = loadLocal(key);
  var initial = local !== null ? local : (seedFn ? seedFn() : []);
  var [data, setDataRaw] = useState(initial);
  var [synced, setSynced] = useState(false);
  var dataRef = useRef(initial);

  useEffect(function(){
    if (!SYNC_ENABLED) return;
    var ref = db.collection("makizen_rolo").doc(key);
    var unsub = ref.onSnapshot(function(snap){
      if (snap.exists && snap.data().list){
        dataRef.current = snap.data().list;
        setDataRaw(snap.data().list);
        saveLocal(key, snap.data().list);
      } else {
        var seeded = local !== null ? local : (seedFn ? seedFn() : []);
        ref.set({ list: seeded });
      }
      setSynced(true);
    }, function(err){
      console.error("Firestore (" + key + "):", err);
    });
    return function(){ unsub(); };
    // eslint-disable-next-line
  }, []);

  function hasIds(list){
    return list.length > 0 && list.every(function(item){ return item && typeof item === "object" && item.id !== undefined; });
  }

  function setData(next){
    var prev = dataRef.current || [];
    dataRef.current = next;
    setDataRaw(next);
    saveLocal(key, next);

    if (!SYNC_ENABLED) return;
    var ref = db.collection("makizen_rolo").doc(key);

    if (hasIds(prev) || hasIds(next)){
      var nextById = {};
      next.forEach(function(item){ if (item && item.id !== undefined) nextById[item.id] = item; });
      var prevById = {};
      prev.forEach(function(item){ if (item && item.id !== undefined) prevById[item.id] = item; });
      var changedIds = Object.keys(nextById).filter(function(id){
        return !prevById[id] || JSON.stringify(prevById[id]) !== JSON.stringify(nextById[id]);
      });
      var removedIds = Object.keys(prevById).filter(function(id){ return !nextById[id]; });

      ref.get().then(function(snap){
        var remoteList = (snap.exists && snap.data().list) ? snap.data().list : [];
        var remoteById = {};
        remoteList.forEach(function(item){ if (item && item.id !== undefined) remoteById[item.id] = item; });
        changedIds.forEach(function(id){ remoteById[id] = nextById[id]; });
        removedIds.forEach(function(id){ delete remoteById[id]; });
        var merged = Object.keys(remoteById).map(function(id){ return remoteById[id]; });
        return ref.set({ list: merged }).then(function(){ return merged; });
      }).then(function(merged){
        if (!merged) return;
        dataRef.current = merged;
        setDataRaw(merged);
        saveLocal(key, merged);
      }).catch(function(e){
        console.error("Error guardando " + key + ":", e);
      });
    } else {
      ref.set({ list: next }).catch(function(e){
        console.error("Error guardando " + key + ":", e);
      });
    }
  }

  return [data, setData, synced];
}

function inReportRange(iso, range){
  var d = new Date(iso);
  var now = new Date();
  if (range === "Hoy") return isToday(iso);
  if (range === "Últimos 7 días"){
    var cutoff = new Date(now);
    cutoff.setDate(cutoff.getDate() - 7);

  return true;
}

function csvEscape(val){
  var s = String(val === undefined || val === null ? "" : val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// Exporta una lista de ventas a un archivo CSV (se abre directo en Excel), sin depender de ninguna librería externa.
function exportOrdersToCSV(list, filename){
  var header = ["Fecha", "Hora", "Cliente/Mesa", "Tipo", "Método de pago", "Platillos", "Descuento", "Envío", "Propina", "Total", "Estado", "Cobró/Canceló/Eliminó"];
  var rows = [header];
  var statusLabel = { pagada:"Pagada", cancelada:"Cancelada", eliminada:"Eliminada" };
  list.forEach(function(o){
    var when = o.paidAt || o.createdAt;
    var d = new Date(when);
    var items = o.items.map(function(it){ return it.qty + "x " + it.name; }).join(" | ");
    var who = o.status === "cancelada" ? (o.cancelledBy || "") : (o.status === "eliminada" ? (o.deletedBy || "") : (o.paidBy || ""));
    rows.push([
      d.toLocaleDateString("es-MX"),
      d.toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" }),
      orderDisplayLabel(o),
      o.type,
      o.status === "pagada" ? (o.paymentMethod || "Efectivo") : "",
      items,
      Number(o.discountAmount) || 0,
      Number(o.deliveryFee) || 0,
      Number(o.tipAmount) || 0,
      orderTotal(o),
      statusLabel[o.status] || o.status,
      who
    ]);
  });
  var csv = "\uFEFF" + rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Convierte un teléfono capturado en México (10 dígitos, con o sin lada 52) al formato que espera wa.me.
function whatsappNumber(phone){
  var d = (phone || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.length === 10) return "52" + d;
  if (d.length === 12 && d.slice(0,2) === "52") return d;
  if (d.length === 13 && d.slice(0,3) === "521") return d;
  return d;
}

function whatsappLink(phone, message){
  var num = whatsappNumber(phone);
  if (!num) return null;
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(message);
}

function timeAgo(iso){
  var diffMs = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "recién";
  if (mins < 60) return mins + " min";
  var hrs = Math.floor(mins / 60);
  return hrs + " h " + (mins % 60) + " min";
}

function orderTotal(order){
  var itemsTotal = order.items.reduce(function(sum, item){
    var modsTotal = item.modifiers.reduce(function(s, m){ return s + Number(m.price); }, 0);
    return sum + (Number(item.price) + modsTotal) * item.qty;
  }, 0);
  var afterDiscount = itemsTotal - (Number(order.discountAmount) || 0) - (Number(order.loyaltyDiscount) || 0);
  if (afterDiscount < 0) afterDiscount = 0;
  return afterDiscount + (Number(order.deliveryFee) || 0);
}

// Sistema propio de alert/confirm. Reemplaza window.alert/window.confirm: esos diálogos
// nativos del navegador hacen que Chrome/Android salgan automáticamente de pantalla completa
// cada vez que aparecen. Estos son 100% HTML propio, así que no afectan el fullscreen.
var _appDialogSetter = null;

function appAlert(message){
  return new Promise(function(resolve){
    if (_appDialogSetter){
      _appDialogSetter({ type: "alert", message: message, onResolve: function(){ resolve(); } });
    } else {
      window.alert(message);
      resolve();
    }
  });
}

function appConfirm(message){
  return new Promise(function(resolve){
    if (_appDialogSetter){
      _appDialogSetter({ type: "confirm", message: message, onResolve: function(result){ resolve(result); } });
    } else {
      resolve(window.confirm(message));
    }
  });
}

function appPrompt(message, defaultValue){
  return new Promise(function(resolve){
    if (_appDialogSetter){
      _appDialogSetter({ type: "prompt", message: message, defaultValue: defaultValue || "", onResolve: function(result){ resolve(result); } });
    } else {
      resolve(window.prompt(message, defaultValue));
    }
  });
}

function AppDialogHost(){
  var [dialog, setDialog] = useState(null);
  var [promptValue, setPromptValue] = useState("");

  useEffect(function(){
    _appDialogSetter = function(next){
      setDialog(next);
      setPromptValue(next ? (next.defaultValue || "") : "");
    };
    return function(){ _appDialogSetter = null; };
  }, []);

  if (!dialog) return null;

  function close(result){
    var resolveFn = dialog.onResolve;
    setDialog(null);
    resolveFn(result);
  }

  return (
    <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget && dialog.type === "alert") close(); }}>
      <div className="modal">
        <p style={{margin:"0 0 20px 0", whiteSpace:"pre-line"}}>{dialog.message}</p>
        {dialog.type === "prompt" && (
          <form onSubmit={function(e){ e.preventDefault(); close(promptValue); }}>
            <input
              type="text"
              autoFocus
              className="shift-gate-pin-input"
              style={{width:"100%", boxSizing:"border-box", marginBottom:"16px"}}
              value={promptValue}
              onChange={function(e){ setPromptValue(e.target.value); }}
            />
          </form>
        )}
        <div className="modal-actions">
          {(dialog.type === "confirm" || dialog.type === "prompt") && (
            <button type="button" className="btn btn-ghost" onClick={function(){ close(dialog.type === "prompt" ? null : false); }}>Cancelar</button>
          )}
          <button
            type="button"
            className="btn btn-primary"
            autoFocus={dialog.type !== "prompt"}
            onClick={function(){
              if (dialog.type === "confirm") close(true);
              else if (dialog.type === "prompt") close(promptValue);
              else close();
            }}
          >
            {dialog.type === "alert" ? "Aceptar" : "Confirmar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Un item sin estación guardada (comandas viejas) se trata como de cocina, para no perderlo de vista.
function isBarItem(item){ return item.station === "bar"; }
function isKitchenItem(item){ return item.station !== "bar"; }
function orderHasKitchenItems(order){ return order.items.some(isKitchenItem); }
function orderHasBarItems(order){ return order.items.some(isBarItem); }

// Una comanda queda "lista" solo cuando todas las estaciones que le aplican terminaron.
function orderFullyReady(order, kitchenReady, barReady){
  var kOk = !orderHasKitchenItems(order) || kitchenReady;
  var bOk = !orderHasBarItems(order) || barReady;
  return kOk && bOk;
}

function minutesSince(iso){
  var diffMs = Date.now() - new Date(iso).getTime();
  return diffMs / 60000;
}

// Niveles KDS: verde < mitad del umbral, amarillo entre la mitad y el umbral, rojo >= umbral (20 min por defecto).
function kdsLevel(mins, lateMin){
  var late = Number(lateMin) > 0 ? Number(lateMin) : 20;
  if (mins < late / 2) return "verde";
  if (mins < late) return "amarillo";
  return "rojo";
}

// Una comanda se considera atrasada si sigue activa (no lista ni pagada) y ya pasó el umbral configurado.
function isOrderLate(order, lateMin){
  var late = Number(lateMin) > 0 ? Number(lateMin) : 20;
  if (order.status !== "en_cocina") return false;
  return minutesSince(order.createdAt) >= late;
}

var KDS_LEVEL_LABEL = { verde:"En tiempo", amarillo:"Atención", rojo:"Urgente" };

function entryTimeLabel(iso){
  var d = new Date(iso);
  return d.toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" });
}

function dayKey(iso){
  var d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function dayLabel(iso){
  var d = new Date(iso);
  var label = d.toLocaleDateString("es-MX", { weekday:"long", day:"2-digit", month:"long" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function elapsedLabel(mins){
  var totalSec = Math.floor(mins * 60);
  var m = Math.floor(totalSec / 60);
  var s = totalSec % 60;
  return m + " min " + (s < 10 ? "0" : "") + s + " s";
}

function orderDisplayLabel(order){
  if (order.type === "Mesa") return "Mesa " + (order.tableNumber || "?");
  return order.customerName ? order.customerName : order.type;
}

function DishModal(props){
  var editing = props.editing;
  var onClose = props.onClose;
  var onSave = props.onSave;
  var categories = props.categories || [];

  var blank = { id:null, category:categories[0] || "", name:"", price:"", description:"", active:true, station:"cocina", modifiers:[] };
  var initial = editing ? Object.assign({}, editing, { modifiers: editing.modifiers.map(function(m){ return Object.assign({}, m); }) }) : blank;

  var [form, setForm] = useState(initial);

  function updateField(key, value){
    var next = Object.assign({}, form);
    next[key] = value;
    setForm(next);
  }

  function updateMod(idx, key, value){
    var mods = form.modifiers.map(function(m, i){
      if (i !== idx) return m;
      var nm = Object.assign({}, m);
      nm[key] = value;
      return nm;
    });
    updateField("modifiers", mods);
  }

  function addMod(){
    updateField("modifiers", form.modifiers.concat([{ name:"", price:0 }]));
  }

  function removeMod(idx){
    updateField("modifiers", form.modifiers.filter(function(m, i){ return i !== idx; }));
  }

  function handleSubmit(){
    if (!form.name.trim()) return;
    var priceNum = Number(form.price);
    if (isNaN(priceNum) || priceNum < 0) return;
    var cleanMods = form.modifiers
      .filter(function(m){ return m.name.trim(); })
      .map(function(m){ return { name:m.name.trim(), price:Number(m.price) || 0 }; });

    var saved = Object.assign({}, form, {
      id: form.id || uid(),
      name: form.name.trim(),
      price: priceNum,
      modifiers: cleanMods
    });
    onSave(saved);
  }

  return (
    <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <h3>{editing ? "Editar platillo" : "Nuevo platillo"}</h3>

        <div className="field">
          <label>Nombre</label>
          <input
            type="text"
            value={form.name}
            placeholder="p. ej. Rollo Zen"
            onChange={function(e){ updateField("name", e.target.value); }}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <label>Categoría</label>
            <select value={form.category} onChange={function(e){ updateField("category", e.target.value); }}>
              {categories.map(function(c){ return <option key={c} value={c}>{c}</option>; })}
            </select>
          </div>
          <div className="field">
            <label>Precio (MXN)</label>
            <input
              type="number"
              min="0"
              step="0.01"
              value={form.price}
              placeholder="0.00"
              onChange={function(e){ updateField("price", e.target.value); }}
            />
          </div>
        </div>

        <div className="field">
          <label>Se prepara en</label>
          <div className="type-selector">
            <div className={"type-btn" + (form.station !== "bar" ? " active" : "")} onClick={function(){ updateField("station", "cocina"); }}>🔥 Cocina</div>
            <div className={"type-btn" + (form.station === "bar" ? " active" : "")} onClick={function(){ updateField("station", "bar"); }}>🍹 Bar</div>
          </div>
        </div>

        <div className="field">
          <label>Descripción</label>
          <textarea
            value={form.description}
            placeholder="Ingredientes o notas para el mesero"
            onChange={function(e){ updateField("description", e.target.value); }}
          />
        </div>

        <div className="field">
          <label>Modificadores</label>
          <div className="mods-editor">
            {form.modifiers.length === 0 && (
              <p style={{fontSize:12, color:"#4A4238", margin:"2px 0 8px 0"}}>Sin modificadores todavía.</p>
            )}
            {form.modifiers.map(function(m, idx){
              return (
                <div className="mod-row" key={idx}>
                  <input
                    type="text"
                    placeholder="p. ej. Extra aguacate"
                    value={m.name}
                    onChange={function(e){ updateMod(idx, "name", e.target.value); }}
                  />
                  <input
                    className="price"
                    type="number"
                    step="0.01"
                    placeholder="+$"
                    value={m.price}
                    onChange={function(e){ updateMod(idx, "price", e.target.value); }}
                  />
                  <button className="mod-remove" onClick={function(){ removeMod(idx); }} title="Quitar">✕</button>
                </div>
              );
            })}
            <button className="add-mod-btn" onClick={addMod}>+ Agregar modificador</button>
          </div>
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSubmit}>Guardar platillo</button>
        </div>
      </div>
    </div>
  );
}

function MenuModule(props){
  var dishes = props.dishes;
  var setDishes = props.setDishes;
  var categories = props.categories || [];
  var setCategories = props.setCategories;

  var [activeCat, setActiveCat] = useState("Todas");
  var [search, setSearch] = useState("");
  var [modalOpen, setModalOpen] = useState(false);
  var [editingDish, setEditingDish] = useState(null);

  var filtered = useMemo(function(){
    return dishes.filter(function(d){
      var matchesCat = activeCat === "Todas" || d.category === activeCat;
      var matchesSearch = d.name.toLowerCase().indexOf(search.toLowerCase()) !== -1;
      return matchesCat && matchesSearch;
    });
  }, [dishes, activeCat, search]);

  function openNew(){
    setEditingDish(null);
    setModalOpen(true);
  }

  function openEdit(dish){
    setEditingDish(dish);
    setModalOpen(true);
  }

  function handleSave(dish){
    var exists = dishes.some(function(d){ return d.id === dish.id; });
    var next = exists
      ? dishes.map(function(d){ return d.id === dish.id ? dish : d; })
      : dishes.concat([Object.assign({}, dish, { order: dishes.length })]);
    setDishes(next);
    setModalOpen(false);
  }

  async function handleDelete(id){
    if (!(await appConfirm("¿Eliminar este platillo del menú?"))) return;
    setDishes(dishes.filter(function(d){ return d.id !== id; }));
  }

  function toggleActive(dish){
    setDishes(dishes.map(function(d){
      return d.id === dish.id ? Object.assign({}, d, { active: !d.active }) : d;
    }));
  }

  async function addCategory(){
    if (!setCategories) return;
    var name = await appPrompt("Nombre de la nueva sección (ej. Yakimeshis, Kushiage):");
    if (!name) return;
    name = name.trim();
    if (!name) return;
    var exists = categories.some(function(c){ return c.toLowerCase() === name.toLowerCase(); });
    if (exists){
      await appAlert("Ya existe una sección con ese nombre.");
      return;
    }
    setCategories(categories.concat([name]));
    setActiveCat(name);
  }

  async function removeCategory(cat){
    if (!setCategories) return;
    var inUse = dishes.some(function(d){ return d.category === cat; });
    if (inUse){
      await appAlert("No puedes eliminar \"" + cat + "\" porque todavía tiene platillos asignados. Cámbialos de sección primero.");
      return;
    }
    if (!(await appConfirm("¿Eliminar la sección \"" + cat + "\"?"))) return;
    setCategories(categories.filter(function(c){ return c !== cat; }));
    if (activeCat === cat) setActiveCat("Todas");
  }

  var [dragId, setDragId] = useState(null);
  var [overId, setOverId] = useState(null);

  var [catDragId, setCatDragId] = useState(null);
  var [catOverId, setCatOverId] = useState(null);

  function handleCatDragStart(e, cat){
    setCatDragId(cat);
    try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(cat)); }catch(err){}
  }

  function handleCatDragOver(e, cat){
    e.preventDefault();
    if (cat !== catDragId) setCatOverId(cat);
  }

  function handleCatDragLeave(cat){
    setCatOverId(function(prev){ return prev === cat ? null : prev; });
  }

  function handleCatDrop(e, targetCat){
    e.preventDefault();
    setCatOverId(null);
    if (!setCategories || !catDragId || catDragId === targetCat){ setCatDragId(null); return; }

    var fromIndex = categories.indexOf(catDragId);
    var toIndex = categories.indexOf(targetCat);
    if (fromIndex === -1 || toIndex === -1){ setCatDragId(null); return; }

    var reordered = categories.slice();
    var moved = reordered.splice(fromIndex, 1)[0];
    reordered.splice(toIndex, 0, moved);

    setCategories(reordered);
    setCatDragId(null);
  }

  function handleCatDragEnd(){
    setCatDragId(null);
    setCatOverId(null);
  }

  function handleDragStart(e, id){
    setDragId(id);
    try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(id)); }catch(err){}
  }

  function handleDragOver(e, id){
    e.preventDefault();
    if (id !== dragId) setOverId(id);
  }

  function handleDragLeave(id){
    setOverId(function(prev){ return prev === id ? null : prev; });
  }

  function handleDrop(e, targetId){
    e.preventDefault();
    setOverId(null);
    if (!dragId || dragId === targetId){ setDragId(null); return; }

    var filteredIds = filtered.map(function(d){ return d.id; });
    var fromIndex = filteredIds.indexOf(dragId);
    var toIndex = filteredIds.indexOf(targetId);
    if (fromIndex === -1 || toIndex === -1){ setDragId(null); return; }

    var reordered = filtered.slice();
    var moved = reordered.splice(fromIndex, 1)[0];
    reordered.splice(toIndex, 0, moved);

    var positions = [];
    dishes.forEach(function(d, i){ if (filteredIds.indexOf(d.id) !== -1) positions.push(i); });
    var newDishes = dishes.slice();
    positions.forEach(function(pos, i){ newDishes[pos] = reordered[i]; });

    newDishes = newDishes.map(function(d, i){ return Object.assign({}, d, { order: i }); }); setDishes(newDishes);
    setDragId(null);
  }

  function handleDragEnd(){
    setDragId(null);
    setOverId(null);
  }

  return (
    <div>
      <div className="toolbar">
        <input
          className="search-input"
          type="text"
          placeholder="Buscar platillo..."
          value={search}
          onChange={function(e){ setSearch(e.target.value); }}
        />
        <button className="btn btn-primary" onClick={openNew}>+ Nuevo platillo</button>
      </div>

      <div className="cat-tabs">
        <div
          className={"cat-tab" + (activeCat === "Todas" ? " active" : "")}
          onClick={function(){ setActiveCat("Todas"); }}
        >Todas ({dishes.length})</div>
        {categories.map(function(cat){
          var count = dishes.filter(function(d){ return d.category === cat; }).length;
          var catClass = "cat-tab"
            + (activeCat === cat ? " active" : "")
            + (catDragId === cat ? " cat-dragging" : "")
            + (catOverId === cat && catDragId !== cat ? " cat-drag-over" : "");
          return (
            <div
              key={cat}
              className={catClass}
              draggable="true"
              onDragStart={function(e){ handleCatDragStart(e, cat); }}
              onDragOver={function(e){ handleCatDragOver(e, cat); }}
              onDragLeave={function(){ handleCatDragLeave(cat); }}
              onDrop={function(e){ handleCatDrop(e, cat); }}
              onDragEnd={handleCatDragEnd}
              onClick={function(){ setActiveCat(cat); }}
              title="Arrastra para reordenar las secciones"
            >
              {cat} ({count})
              {count === 0 && (
                <span
                  className="cat-tab-remove"
                  title={"Eliminar sección \"" + cat + "\""}
                  onClick={function(e){ e.stopPropagation(); removeCategory(cat); }}
                >×</span>
              )}
            </div>
          );
        })}
        <div className="cat-tab cat-tab-add" onClick={addCategory}>+ Sección</div>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-panel">
          <p style={{fontWeight:600}}>No hay platillos que coincidan</p>
          <p style={{fontSize:12.5, marginTop:4}}>Ajusta la búsqueda o el filtro de categoría.</p>
        </div>
      ) : (
        <React.Fragment>
        <div className="drag-order-note">⠿ Arrastra un platillo por su manija para reacomodar el orden del menú</div>
        <div className="dish-grid">
          {filtered.map(function(dish){
            var cardClass = "dish-card"
              + (dish.active ? "" : " inactive")
              + (dragId === dish.id ? " dragging" : "")
              + (overId === dish.id && dragId !== dish.id ? " drag-over" : "");
            return (
              <div
                key={dish.id}
                className={cardClass}
                draggable="true"
                onDragStart={function(e){ handleDragStart(e, dish.id); }}
                onDragOver={function(e){ handleDragOver(e, dish.id); }}
                onDragLeave={function(){ handleDragLeave(dish.id); }}
                onDrop={function(e){ handleDrop(e, dish.id); }}
                onDragEnd={handleDragEnd}
              >
                <span className="dish-drag-handle" title="Arrastrar para reordenar">⠿⠿</span>
                <div className="dish-top">
                  <div>
                    <div className="dish-cat-tag">{dish.category}</div>
                    <div className="dish-name">{dish.name}</div>
                  </div>
                  <div className="dish-price">{money(dish.price)}</div>
                </div>
                <span className={"station-chip " + (dish.station === "bar" ? "bar" : "cocina")}>
                  {dish.station === "bar" ? "🍹 Bar" : "🔥 Cocina"}
                </span>
                {dish.description && <div className="dish-desc">{dish.description}</div>}
                {dish.modifiers.length > 0 && (
                  <div className="dish-mods">
                    {dish.modifiers.map(function(m, i){
                      return (
                        <span className="mod-chip" key={i}>
                          {m.name}{m.price ? " +" + money(m.price) : ""}
                        </span>
                      );
                    })}
                  </div>
                )}
                <div className="dish-actions">
                  <button className="icon-btn" onClick={function(){ openEdit(dish); }}>Editar</button>
                  <button className="icon-btn" onClick={function(){ handleDelete(dish.id); }} style={{color:"#C1443A"}}>Eliminar</button>
                  <span
                    className={"toggle-pill " + (dish.active ? "on" : "off")}
                    onClick={function(){ toggleActive(dish); }}
                  >{dish.active ? "Activo" : "Inactivo"}</span>
                </div>
              </div>
            );
          })}
        </div>
        </React.Fragment>
      )}

      {modalOpen && (
        <DishModal
          editing={editingDish}
          categories={categories}
          onClose={function(){ setModalOpen(false); }}
          onSave={handleSave}
        />
      )}
    </div>
  );
}

  var [activeCat, setActiveCat] = useState(categories[0] || "");
  var [search, setSearch] = useState("");
  var [cart, setCart] = useState([]);
  var [pickerDish, setPickerDish] = useState(null);
  var [pickerMods, setPickerMods] = useState([]);
  var [discountType, setDiscountType] = useState("none");
  var [discountValue, setDiscountValue] = useState("");
  var [discountLabel, setDiscountLabel] = useState("");

  var activeDishes = dishes.filter(function(d){ return d.active; });
  var filtered = activeDishes.filter(function(d){
    var matchesCat = d.category === activeCat;
    var matchesSearch = d.name.toLowerCase().indexOf(search.toLowerCase()) !== -1;
    return (search ? matchesSearch : matchesCat) ;
  });

  var salesCount = {};
  orders.forEach(function(o){
    if (o.status !== "pagada") return;
    o.items.forEach(function(it){
      salesCount[it.dishId] = (salesCount[it.dishId] || 0) + it.qty;
    });
  });
  var topDishes = activeDishes
    .filter(function(d){ return salesCount[d.id] > 0; })
    .sort(function(a,b){ return salesCount[b.id] - salesCount[a.id]; })
    .slice(0, 8);

  function handleCustomerNameChange(value){
    setCustomerName(value);
    var match = customers.find(function(c){ return c.name.toLowerCase() === value.trim().toLowerCase(); });
    if (match){
      if (!customerPhone) setCustomerPhone(match.phone || "");
      if (orderType === "Domicilio" && !customerAddress) setCustomerAddress(match.address || "");
    }
  }

  function openPicker(dish){
    if (dish.modifiers.length === 0){
      addToCart(dish, []);
      return;
    }
    setPickerDish(dish);
    setPickerMods([]);
  }

  function toggleMod(mod){
    var exists = pickerMods.some(function(m){ return m.name === mod.name; });
    if (exists){
      setPickerMods(pickerMods.filter(function(m){ return m.name !== mod.name; }));
    } else {
      setPickerMods(pickerMods.concat([mod]));
    }
  }

  function confirmPicker(){
    addToCart(pickerDish, pickerMods);
    setPickerDish(null);
    setPickerMods([]);
  }

  function addToCart(dish, mods){
    var modKey = mods.map(function(m){ return m.name; }).sort().join("|");
    var idx = cart.findIndex(function(c){
      var cKey = c.modifiers.map(function(m){ return m.name; }).sort().join("|");
      return c.dishId === dish.id && cKey === modKey && !c.note;
    });
    if (idx !== -1){
      var next = cart.slice();
      next[idx] = Object.assign({}, next[idx], { qty: next[idx].qty + 1 });
      setCart(next);
    } else {
      setCart(cart.concat([{
        dishId: dish.id,
        name: dish.name,
        price: dish.price,
        station: dish.station === "bar" ? "bar" : "cocina",
        modifiers: mods,
        note: "",
        qty: 1
      }]));
    }
  }

  async function editNote(idx){
    var current = cart[idx].note || "";
    var note = await appPrompt("Nota para \"" + cart[idx].name + "\" (ej. sin cebollín, extra picante):", current);
    if (note === null) return;
    var next = cart.slice();
    next[idx] = Object.assign({}, next[idx], { note: note.trim() });
    setCart(next);
  }

  function changeQty(idx, delta){
    var next = cart.slice();
    var newQty = next[idx].qty + delta;
    if (newQty <= 0){
      next.splice(idx, 1);
    } else {
      next[idx] = Object.assign({}, next[idx], { qty: newQty });
    }
    setCart(next);
  }

  function removeItem(idx){
    setCart(cart.filter(function(c, i){ return i !== idx; }));
  }

  var cartSubtotal = cart.reduce(function(sum, item){
    var modsTotal = item.modifiers.reduce(function(s, m){ return s + Number(m.price); }, 0);
    return sum + (Number(item.price) + modsTotal) * item.qty;
  }, 0);
  var deliveryFee = orderType === "Domicilio" ? deliveryFeeAmount : 0;

  function cheapestCartUnit(){
    var cheapest = null;
    cart.forEach(function(item){
      var modsTotal = item.modifiers.reduce(function(s, m){ return s + Number(m.price); }, 0);
      var unitPrice = Number(item.price) + modsTotal;
      if (!cheapest || unitPrice < cheapest.price){
        cheapest = { name: item.name, price: unitPrice };
      }
    });
    return cheapest;
  }
  var promo3x2Item = discountType === "promo3x2" ? cheapestCartUnit() : null;

  var rawDiscountValue = Number(discountValue) || 0;
  var discountAmount = 0;
  if (discountType === "percent"){
    discountAmount = cartSubtotal * (rawDiscountValue / 100);
  } else if (discountType === "fixed"){
    discountAmount = rawDiscountValue;
  } else if (discountType === "promo3x2"){
    discountAmount = promo3x2Item ? promo3x2Item.price : 0;
  }
  if (discountAmount > cartSubtotal) discountAmount = cartSubtotal;
  if (discountAmount < 0) discountAmount = 0;

  var total = cartSubtotal - discountAmount + deliveryFee;

  function canSend(){
    if (cart.length === 0) return false;
    if (orderType === "Mesa" && !tableNumber.trim()) return false;
    if (orderType === "Para llevar" && !customerName.trim()) return false;
    if (orderType === "Domicilio" && (!customerName.trim() || !customerAddress.trim())) return false;
    return true;
  }

  function handleSend(){
    if (!canSend()) return;
    if (appendMode){
      onAppend(cart);
      return;
    }
    var order = {
      id: orderId(),
      type: orderType,
      tableNumber: orderType === "Mesa" ? tableNumber.trim() : "",
      tableId: orderType === "Mesa" ? (linkedTableId || selectedTableId) : null,
      customerName: orderType !== "Mesa" ? customerName.trim() : "",
      customerPhone: orderType !== "Mesa" ? customerPhone.trim() : "",
      customerAddress: orderType === "Domicilio" ? customerAddress.trim() : "",
      deliveryFee: deliveryFee,
      discountAmount: discountAmount,
      discountLabel: discountAmount > 0
        ? (discountType === "promo3x2" && promo3x2Item ? "3x2 Martes: " + promo3x2Item.name + " gratis" : discountLabel.trim())
        : "",
      deliveryStatus: orderType === "Domicilio" ? "preparando" : null,
      items: cart,
      status: "en_cocina",
      kitchenReady: false,
      barReady: false,
      createdBy: currentEmployeeName || "",
      createdAt: new Date().toISOString()
    };
    onSend(order);
  }

  return (
    <div className="pos-layout">
      <div className="pos-picker">
        <div className="toolbar">
          <input
            className="search-input"
            type="text"
            placeholder="Buscar platillo..."
            value={search}
            onChange={function(e){ setSearch(e.target.value); }}
          />
        </div>
        {!search && topDishes.length > 0 && (
          <div className="top-dishes-row">
            <div className="top-dishes-label">⭐ Más pedidos</div>
            <div className="top-dishes-scroll">
              {topDishes.map(function(dish){
                return (
                  <div key={dish.id} className="top-dish-chip" onClick={function(){ openPicker(dish); }}>
                    {dish.name}
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {!search && (
          <div className="cat-tabs">
            {categories.map(function(cat){
              return (
                <div
                  key={cat}
                  className={"cat-tab" + (activeCat === cat ? " active" : "")}
                  onClick={function(){ setActiveCat(cat); }}
                >{cat}</div>
              );
            })}
          </div>
        )}
        <div className="dish-grid">
          {filtered.map(function(dish){
            return (
              <div key={dish.id} className="pos-dish-btn" onClick={function(){ openPicker(dish); }}>
                <div className="pos-dish-name">{dish.name}</div>
                <div className="pos-dish-price">{money(dish.price)}</div>
              </div>
            );
          })}
          {filtered.length === 0 && (
            <div className="empty-panel">No hay platillos activos en esta categoría.</div>
          )}
        </div>
      </div>

      <div className="pos-cart">
        <h3>Comanda nueva</h3>

        <div className="type-selector">
          {ORDER_TYPES.map(function(t){
            return (
              <div
                key={t}
                className={"type-btn" + (orderType === t ? " active" : "") + (lockOrderType ? " locked" : "")}
                onClick={function(){ if (!lockOrderType) setOrderType(t); }}
              >{t}</div>
            );
          })}
        </div>

        {orderType === "Mesa" ? (
          presetTableNumber ? (
            <div className="field">
              <label>Mesa</label>
              <div className="preset-table-tag">Mesa {presetTableNumber}</div>
            </div>
          ) : sortedTables.length > 0 ? (
            <div className="field">
              <label>Número de mesa</label>
              <select
                value={selectedTableId || ""}
                onChange={function(e){
                  var id = e.target.value;
                  var t = sortedTables.find(function(x){ return x.id === id; });
                  setSelectedTableId(id || null);
                  setTableNumber(t ? String(t.number) : "");
                }}
              >
                <option value="">Selecciona una mesa…</option>
                {sortedTables.map(function(t){
                  return (
                    <option key={t.id} value={t.id}>
                      Mesa {t.number} · {t.seats} lugares{occupiedTableIds[t.id] ? " (ocupada)" : ""}
                    </option>
                  );
                })}
              </select>
            </div>
          ) : (
            <div className="field">
              <label>Número de mesa</label>
              <input type="text" value={tableNumber} placeholder="p. ej. 5" onChange={function(e){ setTableNumber(e.target.value); }} />
              <p style={{fontSize:11.5, color:"var(--ink-600)", marginTop:4}}>No hay mesas configuradas todavía. Agrégalas en Configuración → Mesas del salón.</p>
            </div>
          )
        ) : (
          <div>
            <div className="field">
              <label>Nombre del cliente</label>
              <input list="customer-names-list" type="text" value={customerName} placeholder="p. ej. Ana Torres" onChange={function(e){ handleCustomerNameChange(e.target.value); }} />
              <datalist id="customer-names-list">
                {customers.map(function(c){ return <option key={c.id} value={c.name} />; })}
              </datalist>
            </div>
            <div className="field">
              <label>Teléfono</label>
              <input type="text" value={customerPhone} placeholder="p. ej. 322 123 4567" onChange={function(e){ setCustomerPhone(e.target.value); }} />
            </div>
            {orderType === "Domicilio" && (
              <div className="field">
                <label>Dirección de entrega</label>
                <textarea value={customerAddress} placeholder="Calle, número, colonia, referencias" onChange={function(e){ setCustomerAddress(e.target.value); }} />
              </div>
            )}
          </div>
        )}

        {cart.length === 0 ? (
          <div className="cart-empty">Agrega platillos del menú para armar la comanda.</div>
        ) : (
          <div>
            {cart.map(function(item, idx){
              var modsTotal = item.modifiers.reduce(function(s, m){ return s + Number(m.price); }, 0);
              var lineTotal = (Number(item.price) + modsTotal) * item.qty;
              return (
                <div className="cart-item" key={idx}>
                  <div className="cart-item-top">
                    <div className="cart-item-name">{item.name}</div>
                    <div className="cart-item-price">{money(lineTotal)}</div>
                  </div>
                  {item.modifiers.length > 0 && (
                    <div className="cart-item-mods">
                      {item.modifiers.map(function(m){ return m.name; }).join(", ")}
                    </div>
                  )}
                  {item.note && (
                    <div className="cart-item-note">📝 {item.note}</div>
                  )}
                  <div className="qty-stepper">
                    <button className="qty-btn" onClick={function(){ changeQty(idx, -1); }}>−</button>
                    <span className="qty-val">{item.qty}</span>
                    <button className="qty-btn" onClick={function(){ changeQty(idx, 1); }}>+</button>
                  </div>
                  <button className="cart-item-remove" onClick={function(){ editNote(idx); }}>{item.note ? "Editar nota" : "+ Nota"}</button>
                  <button className="cart-item-remove" onClick={function(){ removeItem(idx); }}>Quitar</button>
                </div>
              );
            })}
          </div>
        )}

        {!appendMode && cart.length > 0 && (
          <div className="discount-box">
            <div className="discount-toggle">
              <div className={"discount-toggle-btn" + (discountType === "none" ? " active" : "")} onClick={function(){ setDiscountType("none"); setDiscountValue(""); setDiscountLabel(""); }}>Sin descuento</div>
              <div className={"discount-toggle-btn" + (discountType === "percent" ? " active" : "")} onClick={function(){ setDiscountType("percent"); }}>% Porcentaje</div>
              <div className={"discount-toggle-btn" + (discountType === "fixed" ? " active" : "")} onClick={function(){ setDiscountType("fixed"); }}>$ Monto fijo</div>
              <div className={"discount-toggle-btn" + (discountType === "promo3x2" ? " active" : "")} onClick={function(){ setDiscountType("promo3x2"); setDiscountValue(""); setDiscountLabel(""); }}>🎉 3x2</div>
            </div>
            {discountType === "promo3x2" && (
              <div style={{marginTop:10}}>
                {promo3x2Item ? (
                  <p style={{fontSize:13, fontWeight:600}}>
                    🎁 Gratis: {promo3x2Item.name} ({money(promo3x2Item.price)}) — el platillo de menor precio en el carrito.
                  </p>
                ) : (
                  <p style={{fontSize:12.5, color:"var(--ink-600)"}}>Agrega platillos al carrito para calcular el gratis.</p>
                )}
                <p style={{fontSize:11.5, color:"var(--ink-600)", marginTop:6}}>
                  Recuerda: la promo 3x2 aplica pidiendo 2 rollos (se cobran los 2 de mayor precio); el de menor precio se descuenta como gratis automáticamente.
                </p>
              </div>
            )}
            {(discountType === "percent" || discountType === "fixed") && (
              <div className="field-row" style={{marginTop:10}}>
                <div className="field">
                  <label>{discountType === "percent" ? "Porcentaje (%)" : "Monto ($)"}</label>
                  <input
                    type="number"
                    min="0"
                    value={discountValue}
                    placeholder={discountType === "percent" ? "p. ej. 10" : "p. ej. 50"}
                    onChange={function(e){ setDiscountValue(e.target.value); }}
                  />
                </div>
                <div className="field">
                  <label>Motivo</label>
                  <input
                    type="text"
                    value={discountLabel}
                    placeholder="p. ej. Primera compra, 2x1 Crunchy"
                    onChange={function(e){ setDiscountLabel(e.target.value); }}
                  />
                </div>
              </div>
            )}
          </div>
        )}

        {!appendMode && discountAmount > 0 && (
          <div className="cart-total-row" style={{fontSize:13, color:"var(--umeboshi-500)"}}>
            <span>Descuento{(discountType === "promo3x2" && promo3x2Item ? "3x2 Martes: " + promo3x2Item.name + " gratis" : discountLabel.trim()) ? " (" + (discountType === "promo3x2" && promo3x2Item ? "3x2 Martes: " + promo3x2Item.name + " gratis" : discountLabel.trim()) + ")" : ""}</span>
            <span>−{money(discountAmount)}</span>
          </div>
        )}

        {!appendMode && orderType === "Domicilio" && (
          <div className="cart-total-row" style={{fontSize:13, color:"var(--ink-600)"}}>
            <span>Envío</span>
            <span>{money(deliveryFee)}</span>
          </div>
        )}

        <div className="cart-total-row">
          <span>{appendMode ? "Subtotal a agregar" : "Total"}</span>
          <span className="cart-total-value">{money(appendMode ? cartSubtotal : total)}</span>
        </div>

        <div className="modal-actions" style={{justifyContent:"space-between"}}>
          <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSend} disabled={!canSend()}>{appendMode ? "Agregar a la comanda" : "Enviar a cocina"}</button>
        </div>
      </div>

      {pickerDish && (
        <div className="modal-backdrop" onClick={function(e){ if (e.target === e.currentTarget) setPickerDish(null); }}>
          <div className="modal" style={{maxWidth:380}}>
            <h3>{pickerDish.name}</h3>
            <p style={{fontSize:12.5, color:"#4A4238", marginTop:-10}}>Elige los modificadores que apliquen.</p>
            <div className="mod-picker">
              {pickerDish.modifiers.map(function(m, i){
                var checked = pickerMods.some(function(pm){ return pm.name === m.name; });
                return (
                  <label key={i}>
                    <input type="checkbox" checked={checked} onChange={function(){ toggleMod(m); }} />
                    <span>{m.name}{m.price ? " (+" + money(m.price) + ")" : ""}</span>
                  </label>
                );
              })}
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={function(){ setPickerDish(null); }}>Cancelar</button>
              <button className="btn btn-primary" onClick={confirmPicker}>Agregar a la comanda</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
